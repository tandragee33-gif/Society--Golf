<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Tournament Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; --info: #0288d1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        #club-logo-display { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }

        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav button { flex: 1; min-width: 80px; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }

        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 10px; }
        .hole-input input { padding: 4px 0; text-align: center; width: 100% !important; }

        .selector-list { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 8px; }
        .selector-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .team-box { background: #f9f9f9; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .champion-box { background: #fffde7; border: 2px solid var(--accent); padding: 15px; border-radius: 12px; text-align: center; margin-top: 20px; }
        .winner-row { background: #e8f5e9; font-weight: bold; color: #2e7d32; border-radius: 4px; }

        @media print {
            .nav, .btn, .btn-outline, .btn-del, .no-print { display: none !important; }
            body { background: white; }
            .container { padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body onload="init()">

<div class="header no-print">
    <img id="club-logo-display" src="" alt="Logo">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav no-print">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Round</button>
    <button onclick="showTab('tab-team')" id="btn-team">Team</button>
    <button onclick="showTab('tab-doubles')" id="btn-doubles">Doubles</button>
    <button onclick="showTab('tab-stats')" id="btn-stats">Stats</button>
    <button onclick="showTab('tab-pairs')" id="btn-pairs">Pairs (KO)</button>
    <button onclick="showTab('tab-singles')" id="btn-singles">Singles (KO)</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- DASHBOARD -->
    <div id="tab-dash" class="tab-content">
        <div id="dash-main-view">
            <div class="card">
                <h3>Tournament Titles</h3>
                <div id="past-tourney-list"></div>
            </div>
            <div class="card">
                <h3>Recent Rounds</h3>
                <select id="dashSeason" onchange="renderDashboard()"></select>
                <div id="dash-list"></div>
            </div>
        </div>
    </div>

    <!-- ROUND ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3>New Round</h3>
            <input type="text" id="rDate" placeholder="dd/mm/yyyy">
            <select id="rCourse"><option value="">Select Course</option></select>
            <select id="rPlayer"><option value="">Select Player</option></select>
            <div class="score-grid" id="round-scores"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
        </div>
    </div>

    <!-- TEAM COMPETITION -->
    <div id="tab-team" class="tab-content hidden">
        <div class="card">
            <h3>Team Competition (4-Player)</h3>
            <input type="text" id="teamDate" placeholder="dd/mm/yyyy">
            <div id="team-step1">
                <div id="team-player-selector" class="selector-list"></div>
                <button class="btn" onclick="setupTeamCards()">Create Team Scorecards</button>
            </div>
            <div id="team-step2" class="hidden">
                <button class="btn-outline" onclick="syncTeamScores()">Sync with History</button>
                <div id="team-scorecards"></div>
                <button class="btn" onclick="calculateTeamResults()">Calculate Results</button>
                <button class="btn-outline" onclick="resetTeamView()">Back</button>
            </div>
            <div id="team-output"></div>
            <div id="team-winner-area"></div>
        </div>
    </div>

    <!-- DOUBLES -->
    <div id="tab-doubles" class="tab-content hidden">
        <div class="card">
            <h3>Doubles Combined</h3>
            <input type="text" id="dbDate" placeholder="dd/mm/yyyy">
            <div id="doubles-selector" class="selector-list"></div>
            <button class="btn" onclick="setupDoublesTeams()">Create Scorecards</button>
            <div id="doubles-output"></div>
        </div>
    </div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Profile</h3>
            <input type="text" id="setupClubName" placeholder="Club Name">
            <button class="btn" onclick="saveClubProfile()">Update Profile</button>
        </div>
        <div class="card">
            <h3>Player Registry</h3>
            <input type="text" id="pName" placeholder="Full Name">
            <input type="number" id="pHC" placeholder="Handicap">
            <button class="btn" onclick="savePlayer()">Save Player</button>
            <div id="admin-players"></div>
        </div>
    </div>
</div>

<script>
    // State management
    let players = [], courses = [], rounds = [], pastComps = [], club = { name: "Golf Pro Manager", logo: "" };
    let activeTeams = [];

    // Core Init
    function init() {
        loadData();
        setupInputGrids();
        applyClubProfile();
        showTab('tab-dash');
    }

    function loadData() {
        players = JSON.parse(localStorage.getItem('g_players')) || [];
        courses = JSON.parse(localStorage.getItem('g_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g_rounds')) || [];
        pastComps = JSON.parse(localStorage.getItem('g_pastComps')) || [];
        club = JSON.parse(localStorage.getItem('g_club')) || { name: "Golf Pro Manager", logo: "" };
    }

    function saveData() {
        localStorage.setItem('g_players', JSON.stringify(players));
        localStorage.setItem('g_courses', JSON.stringify(courses));
        localStorage.setItem('g_rounds', JSON.stringify(rounds));
        localStorage.setItem('g_pastComps', JSON.stringify(pastComps));
        localStorage.setItem('g_club', JSON.stringify(club));
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        const btnId = 'btn-' + id.split('-')[1];
        if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');

        if(id === 'tab-team') renderTeamPlayerSelector();
        if(id === 'tab-comp') populateRoundSelectors();
        if(id === 'tab-setup') renderAdmin();
    }

    // Player/Course Logic
    function savePlayer() {
        const name = document.getElementById('pName').value;
        const hc = document.getElementById('pHC').value;
        if(!name) return;
        players.push({ id: Date.now(), name, hc });
        saveData();
        renderAdmin();
        document.getElementById('pName').value = '';
    }

    function renderAdmin() {
        const list = document.getElementById('admin-players');
        list.innerHTML = players.map(p => `<div class="item-row">${p.name} (HC: ${p.hc}) <button class="btn-del" onclick="deletePlayer(${p.id})">X</button></div>`).join('');
    }

    function deletePlayer(id) {
        players = players.filter(p => p.id !== id);
        saveData();
        renderAdmin();
    }

    // Team Logic
    function renderTeamPlayerSelector() {
        document.getElementById('team-player-selector').innerHTML = players.map(p => `
            <div class="selector-item">
                <label>${p.name}</label>
                <input type="checkbox" class="team-ck" value="${p.id}">
            </div>`).join('');
    }

    function setupTeamCards() {
        const ids = Array.from(document.querySelectorAll('.team-ck:checked')).map(i => i.value);
        if(ids.length < 4 || ids.length % 4 !== 0) return alert("Select players in groups of 4.");
        activeTeams = [];
        for(let i=0; i<ids.length; i+=4) activeTeams.push([ids[i], ids[i+1], ids[i+2], ids[i+3]]);
        
        renderTeamScorecards();
        document.getElementById('team-step1').classList.add('hidden');
        document.getElementById('team-step2').classList.remove('hidden');
    }

    function renderTeamScorecards() {
        document.getElementById('team-scorecards').innerHTML = activeTeams.map((team, idx) => `
            <div class="team-box">
                <b>Team ${idx+1}</b>
                ${team.map(pId => `<div id="sync-status-${pId}" style="font-size:11px; color:red;">${players.find(p=>p.id==pId).name}: No Data</div>`).join('')}
            </div>`).join('');
    }

    function syncTeamScores() {
        const targetDate = document.getElementById('teamDate').value;
        let count = 0;
        activeTeams.flat().forEach(pId => {
            const match = rounds.find(r => r.date === targetDate && r.playerId == pId);
            if(match) {
                const el = document.getElementById(`sync-status-${pId}`);
                el.innerText = `${players.find(p=>p.id==pId).name}: Synced`;
                el.style.color = "green";
                el.dataset.scores = JSON.stringify(match.scores);
                count++;
            }
        });
        alert(`Synced ${count} scores.`);
    }

    function calculateTeamResults() {
        const results = activeTeams.map((teamIds, idx) => {
            let total = 0;
            for(let h=0; h<18; h++) {
                let holeScores = teamIds.map(id => {
                    const data = document.getElementById(`sync-status-${id}`).dataset.scores;
                    return data ? JSON.parse(data)[h] : 0;
                }).sort((a,b) => b-a);
                
                if(h === 8 || h === 17) total += holeScores.reduce((a,b) => a+b, 0);
                else total += (Number(holeScores[0]) + Number(holeScores[1]));
            }
            return { name: teamIds.map(id => players.find(p=>p.id==id).name).join(', '), score: total };
        }).sort((a,b) => b.score - a.score);

        document.getElementById('team-output').innerHTML = results.map(r => `<div class="item-row"><b>${r.name}</b> <span>${r.score} pts</span></div>`).join('');
    }

    function resetTeamView() {
        document.getElementById('team-step1').classList.remove('hidden');
        document.getElementById('team-step2').classList.add('hidden');
        document.getElementById('team-output').innerHTML = '';
    }

    // Helper functions
    function setupInputGrids() {
        const grid = document.getElementById('round-scores');
        grid.innerHTML = '';
        for(let i=1; i<=18; i++) {
            grid.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="round-scores-val"></div>`;
        }
    }

    function populateRoundSelectors() {
        const pSel = document.getElementById('rPlayer');
        pSel.innerHTML = '<option value="">Select Player</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function applyClubProfile() {
        document.getElementById('header-club-name').innerText = club.name;
    }

    function saveRound() {
        const pId = document.getElementById('rPlayer').value;
        const date = document.getElementById('rDate').value;
        const scoreInputs = document.querySelectorAll('.round-scores-val');
        const scores = Array.from(scoreInputs).map(i => i.value || 0);
        const totalPoints = scores.reduce((a,b) => Number(a) + Number(b), 0);

        rounds.push({ id: Date.now(), playerId: pId, date, scores, points: totalPoints, season: date.split('/')[2] });
        saveData();
        alert("Round Saved!");
        showTab('tab-dash');
    }
</script>

</body>
</html>
