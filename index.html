<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Pro Manager - Tournament Edition</title>

<style>
:root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }

.header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
.header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }

.nav { display: flex; background: var(--primary); position: sticky; top: 0; }
.nav button { flex: 1; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; }
.nav button.active { border-bottom: 4px solid var(--accent); }

.container { padding: 15px; max-width: 900px; margin: auto; }
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
.hidden { display: none !important; }

input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; }

.btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
.btn-outline { background: white; border: 2px solid var(--primary); }
.btn-del { background: var(--danger); color: white; }

.item-row { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
.winner-row { background: #e8f5e9; font-weight: bold; }
</style>
</head>

<body>

<div class="header">
<h1>Golf Pro Manager</h1>
</div>

<div class="nav">
<button onclick="showTab('tab-dash')" class="active">History</button>
</div>

<div class="container">

<div id="tab-dash">

<div class="card">
<h3>Recent Activity</h3>
<div id="dash-list"></div>
</div>

<div id="dash-detail" class="hidden card">
<button class="btn-outline" onclick="closeDetail()">← Back</button>
<h3 id="detail-title"></h3>

<button class="btn" onclick="shareWhatsApp()">Share via WhatsApp</button>

<div id="detail-results"></div>
</div>

</div>

</div>

<script>

let rounds = [];

function showTab() {
renderDashboard();
}

function renderDashboard() {
const comps = rounds.reduce((acc, r) => {
const k = r.date;
if (!acc[k]) acc[k] = { date: r.date };
return acc;
}, {});

document.getElementById('dash-list').innerHTML =
Object.values(comps).map(c =>
`<div class="item-row" onclick="viewDetail('${c.date}')">
<span>${c.date}</span><span>View ></span></div>`
).join('');
}

function viewDetail(d) {
document.getElementById('dash-detail').classList.remove('hidden');

const filtered = rounds.filter(r => r.date === d);
filtered.sort((a, b) => b.points - a.points);

document.getElementById('detail-title').innerText = d;

document.getElementById('detail-results').innerHTML =
filtered.map((r, index) => {

let medal = '';
if (index === 0) medal = '🏆';
else if (index === 1) medal = '🥈';
else if (index === 2) medal = '🥉';

return `
<div class="item-row ${index === 0 ? 'winner-row' : ''}">
<span>${medal} ${index + 1}. ${r.player}</span>
<span><b>${r.points} pts</b></span>
</div>`;
}).join('');
}

function closeDetail() {
document.getElementById('dash-detail').classList.add('hidden');
}

function shareWhatsApp() {
const title = document.getElementById('detail-title').innerText;
const rows = document.querySelectorAll('#detail-results .item-row');

let message = `🏆 *${title}*\n\n`;

rows.forEach((row, index) => {
const name = row.children[0].innerText;
const pts = row.children[1].innerText;

let medal = '';
if (index === 0) medal = '🏆';
else if (index === 1) medal = '🥈';
else if (index === 2) medal = '🥉';

message += `${medal} ${name.replace(/^[🏆🥈🥉] /, '')} — ${pts}\n`;
});

message += `\n📊 Sent via Golf Pro Manager`;

const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
window.open(url, '_blank');
}

/* DEMO DATA */
rounds = [
{date:'12/04/2026', player:'John Smith', points:36},
{date:'12/04/2026', player:'Mike Jones', points:34},
{date:'12/04/2026', player:'Liam Brown', points:31},
{date:'12/04/2026', player:'Tom Kelly', points:29}
];

renderDashboard();

</script>

</body>
</html>
