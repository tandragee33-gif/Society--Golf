<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Tournament Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; --info: #0288d1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        #club-logo-display { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }

        /* Navigation */
        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; }
        .nav button { flex: 1; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-bottom: 4px solid transparent; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        
        /* Dropdown Logic */
        .dropdown { flex: 1; position: relative; display: inline-block; }
        .dropbtn { width: 100%; height: 100%; color: white; background: none; border: none; font-size: 10px; font-weight: bold; text-transform: uppercase; cursor: pointer; padding: 14px 5px; border-bottom: 4px solid transparent; }
        .dropdown:hover .dropbtn { background: rgba(255,255,255,0.1); }
        .dropdown-content { 
            display: none; 
            position: absolute; 
            background-color: var(--primary); 
            min-width: 150px; 
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2); 
            z-index: 1001; 
            top: 100%;
            left: 0;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content button { 
            text-align: left; 
            width: 100%; 
            padding: 12px 15px; 
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: block;
            border-bottom: none;
        }
        .dropdown-content button:hover { background-color: rgba(255,255,255,0.2); border-bottom: none; }

        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-save-comp { background: var(--success); color: white; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-share { background: #673ab7; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 10px; }
        .hole-input input { padding: 4px 0; text-align: center; width: 100% !important; }

        .selector-list { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 8px; }
        .selector-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .selector-item input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; }

        .match-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; background: #fff; border-left: 5px solid var(--accent); }
        .winner-row { background: #e8f5e9; font-weight: bold; color: #2e7d32; padding: 4px; border-radius: 4px; }
        .champion-box { background: #fffde7; border: 2px solid var(--accent); padding: 15px; border-radius: 12px; text-align: center; margin-top: 20px; }

        .pts-input { width: 60px !important; text-align: center; margin: 0 !important; padding: 5px !important; border: 2px solid var(--primary); }
        .team-box { background: #f9f9f9; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; }

        .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .stats-table th { text-align: left; background: #f8f8f8; padding: 8px; border-bottom: 2px solid #ddd; }
        .stats-table td { padding: 8px; border-bottom: 1px solid #eee; }

        .report-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .report-logo { max-height: 60px; margin-bottom: 10px; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .report-table th { background: #f0f0f0; border: 1px solid #ddd; padding: 8px; text-align: left; }
        .report-table td { border: 1px solid #ddd; padding: 8px; }

        @media print {
            .nav, .btn, .btn-outline, .btn-del, .selector-list, label, #db-step1, input, hr, .btn-save-comp, .header, #past-tourney-list-card, #recent-rounds-card, .dropdown { display: none !important; }
            body { background: white; }
            .container { padding: 0; max-width: 100%; }
            .card { box-shadow: none; border: none; }
            #dash-detail { display: block !important; position: absolute; top: 0; width: 100%; }
            .hidden { display: none !important; }
        }
    </style>
</head>
<body onload="init()">

<div class="header no-print">
    <img id="club-logo-display" src="" alt="Logo">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav no-print">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Round</button>
    
    <div class="dropdown">
        <button class="dropbtn" id="btn-comps">Comps ▾</button>
        <div class="dropdown-content">
            <button onclick="showTab('tab-doubles')" id="btn-doubles">Doubles</button>
            <button onclick="showTab('tab-pairs')" id="btn-pairs">Pairs (KO)</button>
            <button onclick="showTab('tab-singles')" id="btn-singles">Singles (KO)</button>
        </div>
    </div>

    <button onclick="showTab('tab-stats')" id="btn-stats">Stats</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- DASHBOARD -->
    <div id="tab-dash" class="tab-content">
        <div id="dash-main-view">
            <div class="card" id="past-tourney-list-card">
                <h3>Tournament Titles</h3>
                <div id="past-tourney-list"></div>
            </div>
            <div class="card" id="recent-rounds-card">
                <h3>Recent Rounds</h3>
                <select id="dashSeason" onchange="renderDashboard()"></select>
                <div id="dash-list"></div>
            </div>
        </div>
        <div id="dash-detail" class="hidden card">
            <button class="btn-outline no-print" onclick="closeDetail()">← Back</button>
            <div id="report-content">
                <div class="report-header">
                    <img id="report-logo-img" class="report-logo" src="" style="display:none;">
                    <h2 id="report-club-name"></h2>
                    <h3 id="detail-title"></h3>
                    <p id="detail-date"></p>
                </div>
                <table class="report-table">
                    <thead><tr><th>Pos</th><th>Player</th><th>Points</th></tr></thead>
                    <tbody id="detail-results"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ROUND ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3 id="roundTitle">New Round</h3>
            <input type="hidden" id="editRoundId">
            <input type="text" id="rDate" placeholder="dd/mm/yyyy">
            <select id="rCourse"><option value="">Select Course</option></select>
            <select id="rPlayer"><option value="">Select Player</option></select>
            <div class="score-grid" id="round-scores"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
            <button class="btn-outline" style="width:100%" onclick="resetRoundForm()">Clear</button>
        </div>
    </div>

    <!-- DOUBLES -->
    <div id="tab-doubles" class="tab-content hidden">
        <div class="card">
            <h3>Doubles Combined</h3>
            <input type="text" id="dbDate" placeholder="dd/mm/yyyy">
            <div id="db-step1">
                <div id="doubles-selector" class="selector-list"></div>
                <button class="btn" onclick="setupDoublesTeams()">Create Scorecards</button>
            </div>
            <div id="db-step2" class="hidden">
                <div id="doubles-scorecards"></div>
                <button class="btn" onclick="calculateDoublesResults()">Calculate</button>
            </div>
            <div id="doubles-output"></div>
            <div id="db-winner-area"></div>
        </div>
    </div>

    <!-- PAIRS KO -->
    <div id="tab-pairs" class="tab-content hidden">
        <div class="card">
            <h3>Pairs Knockdown</h3>
            <div id="p-setup">
                <div id="p-selector" class="selector-list"></div>
                <button class="btn" onclick="initTourney('pairs')">Start Tournament</button>
            </div>
            <div id="p-bracket"></div>
            <div id="p-winner-area"></div>
        </div>
    </div>

    <!-- SINGLES KO -->
    <div id="tab-singles" class="tab-content hidden">
        <div class="card">
            <h3>Singles Knockdown</h3>
            <div id="s-setup">
                <div id="s-selector" class="selector-list"></div>
                <button class="btn" onclick="initTourney('singles')">Start Tournament</button>
            </div>
            <div id="s-bracket"></div>
            <div id="s-winner-area"></div>
        </div>
    </div>

    <!-- STATS -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="card">
            <h3>Stats History</h3>
            <input type="month" id="statsFilterDate" onchange="renderStats()">
            <table class="stats-table">
                <thead><tr><th>Player</th><th>Date</th><th>Pts</th><th>Action</th></tr></thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>
    </div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Info</h3>
            <input type="text" id="setupClubName" placeholder="Club Name">
            <input type="file" onchange="processLogo(this)">
            <button class="btn" onclick="saveClubProfile()">Update</button>
        </div>
        <div class="card">
            <h3>Players</h3>
            <input type="hidden" id="editPlayerId">
            <input type="text" id="pName" placeholder="Name">
            <input type="number" id="pHC" placeholder="Handicap">
            <button class="btn" onclick="savePlayer()">Save Player</button>
            <div id="admin-players"></div>
        </div>
        <div class="card">
            <h3>Courses</h3>
            <input type="hidden" id="editCourseId">
            <input type="text" id="cName" placeholder="Course Name">
            <button class="btn" onclick="saveCourse()">Save Course</button>
            <div id="admin-courses"></div>
        </div>
        <button class="btn-del" onclick="factoryReset()">Wipe All Data</button>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], pairsT = null, singlesT = null, pastComps = [], club = { name: "Golf Pro Manager", logo: "" };
    let tempTeams = [];

    function loadData() {
        players = JSON.parse(localStorage.getItem('g_players')) || [];
        courses = JSON.parse(localStorage.getItem('g_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g_rounds')) || [];
        pairsT = JSON.parse(localStorage.getItem('g_pairsT'));
        singlesT = JSON.parse(localStorage.getItem('g_singlesT'));
        pastComps = JSON.parse(localStorage.getItem('g_pastComps')) || [];
        club = JSON.parse(localStorage.getItem('g_club')) || { name: "Golf Pro Manager", logo: "" };
    }

    function saveData() {
        localStorage.setItem('g_players', JSON.stringify(players));
        localStorage.setItem('g_courses', JSON.stringify(courses));
        localStorage.setItem('g_rounds', JSON.stringify(rounds));
        localStorage.setItem('g_pairsT', JSON.stringify(pairsT));
        localStorage.setItem('g_singlesT', JSON.stringify(singlesT));
        localStorage.setItem('g_pastComps', JSON.stringify(pastComps));
        localStorage.setItem('g_club', JSON.stringify(club));
    }

    function init() {
        loadData();
        setupInputGrids();
        applyClubProfile();
        updateSeasonDropdown();
        showTab('tab-dash');
    }

    function setupInputGrids() {
        const el = document.getElementById('round-scores');
        el.innerHTML = '';
        for(let i=1; i<=18; i++) el.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="round-scores-val"></div>`;
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.nav button, .dropbtn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(id).classList.remove('hidden');

        const compsTabs = ['tab-doubles', 'tab-pairs', 'tab-singles'];
        if(compsTabs.includes(id)) {
            document.getElementById('btn-comps').classList.add('active');
        } else {
            const btnId = 'btn-' + id.split('-')[1];
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
        }

        if(id === 'tab-setup') renderAdmin();
        if(id === 'tab-dash') { closeDetail(); renderDashboard(); renderPastComps(); }
        if(id === 'tab-stats') renderStats();
        if(id === 'tab-comp') populateSelectors();
        if(id === 'tab-doubles') renderDoublesSelector();
        if(id === 'tab-pairs' || id === 'tab-singles') renderMatchplay(id.split('-')[1]);
    }

    function populateSelectors() {
        document.getElementById('rCourse').innerHTML = '<option value="">Course</option>' + courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('rPlayer').innerHTML = '<option value="">Player</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function saveRound() {
        const pId = document.getElementById('rPlayer').value;
        const cId = document.getElementById('rCourse').value;
        const date = document.getElementById('rDate').value;
        if(!pId || !cId || !date) return alert("Missing fields");

        let pts = 0;
        document.querySelectorAll('.round-scores-val').forEach(i => pts += (parseInt(i.value) || 0));

        rounds.push({
            id: Date.now(),
            playerId: pId,
            playerName: players.find(p => p.id == pId).name,
            courseId: cId,
            courseName: courses.find(c => c.id == cId).name,
            date: parseDate(date),
            points: pts,
            season: date.split('/')[2] || new Date().getFullYear()
        });
        saveData();
        alert("Saved");
        resetRoundForm();
    }

    function resetRoundForm() {
        document.querySelectorAll('.round-scores-val').forEach(i => i.value = '');
        document.getElementById('rPlayer').value = '';
        document.getElementById('rCourse').value = '';
    }

    function renderStats() {
        const filter = document.getElementById('statsFilterDate').value;
        const body = document.getElementById('stats-body');
        body.innerHTML = rounds.filter(r => !filter || r.date.startsWith(filter)).map(r => `
            <tr>
                <td>${r.playerName}</td>
                <td>${formatDate(r.date)}</td>
                <td>${r.points}</td>
                <td><button class="btn-del" onclick="deleteRound(${r.id})">X</button></td>
            </tr>`).join('');
    }

    function deleteRound(id) {
        rounds = rounds.filter(r => r.id !== id);
        saveData(); renderStats();
    }

    function renderAdmin() {
        document.getElementById('admin-players').innerHTML = players.map(p => `<div class="item-row">${p.name} (${p.hc}) <button class="btn-del" onclick="deletePlayer(${p.id})">X</button></div>`).join('');
        document.getElementById('admin-courses').innerHTML = courses.map(c => `<div class="item-row">${c.name} <button class="btn-del" onclick="deleteCourse(${c.id})">X</button></div>`).join('');
    }

    function savePlayer() {
        const name = document.getElementById('pName').value;
        const hc = document.getElementById('pHC').value;
        if(!name) return;
        players.push({ id: Date.now(), name, hc });
        saveData(); renderAdmin();
        document.getElementById('pName').value = '';
    }

    function deletePlayer(id) { players = players.filter(p => p.id !== id); saveData(); renderAdmin(); }

    function saveCourse() {
        const name = document.getElementById('cName').value;
        if(!name) return;
        courses.push({ id: Date.now(), name });
        saveData(); renderAdmin();
        document.getElementById('cName').value = '';
    }

    function deleteCourse(id) { courses = courses.filter(c => c.id !== id); saveData(); renderAdmin(); }

    function renderDashboard() {
        const s = document.getElementById('dashSeason').value;
        const grouped = rounds.filter(r => r.season == s).reduce((acc, r) => {
            const k = r.date + r.courseId;
            if(!acc[k]) acc[k] = { date: r.date, course: r.courseName, id: r.courseId, count: 0 };
            acc[k].count++;
            return acc;
        }, {});
        document.getElementById('dash-list').innerHTML = Object.values(grouped).map(g => `
            <div class="item-row" onclick="viewDetail('${g.date}','${g.id}')">
                <span><b>${g.course}</b><br><small>${formatDate(g.date)}</small></span>
                <span>${g.count} Players ></span>
            </div>`).join('');
    }

    function viewDetail(date, cId) {
        const filtered = rounds.filter(r => r.date === date && r.courseId == cId).sort((a,b) => b.points - a.points);
        document.getElementById('dash-main-view').classList.add('hidden');
        document.getElementById('dash-detail').classList.remove('hidden');
        document.getElementById('detail-title').innerText = filtered[0].courseName;
        document.getElementById('detail-date').innerText = formatDate(date);
        document.getElementById('detail-results').innerHTML = filtered.map((r,i) => `<tr><td>${i+1}</td><td>${r.playerName}</td><td>${r.points}</td></tr>`).join('');
    }

    function closeDetail() { document.getElementById('dash-main-view').classList.remove('hidden'); document.getElementById('dash-detail').classList.add('hidden'); }

    function renderMatchplay(type) {
        const t = (type === 'pairs') ? pairsT : singlesT;
        if(!t) {
            document.getElementById(type[0]+'-setup').classList.remove('hidden');
            document.getElementById(type[0]+'-bracket').classList.add('hidden');
            document.getElementById(type[0]+'-selector').innerHTML = players.map(p => `<div class="selector-item">${p.name} <input type="checkbox" class="${type[0]}-ck" value="${p.id}"></div>`).join('');
        } else {
            document.getElementById(type[0]+'-setup').classList.add('hidden');
            document.getElementById(type[0]+'-bracket').classList.remove('hidden');
            document.getElementById(type[0]+'-bracket').innerHTML = `<button class="btn-del" onclick="resetT('${type}')">Reset</button>` + t.rounds.map((r, i) => `<h4>Rd ${i+1}</h4>` + r.map(m => `<div class="match-card">${m.uA.name} vs ${m.uB?m.uB.name:'BYE'} <button onclick="setWin('${type}',${i},'${m.id}','A')">A</button><button onclick="setWin('${type}',${i},'${m.id}','B')">B</button></div>`).join('')).join('');
        }
    }

    function initTourney(type) {
        const ids = Array.from(document.querySelectorAll(`.${type[0]}-ck:checked`)).map(c => c.value);
        let units = ids.map(id => ({id, name: players.find(p=>p.id==id).name}));
        if(type==='pairs') { /* simple pair logic */ }
        const matches = [];
        for(let i=0; i<units.length; i+=2) matches.push({id: i, uA: units[i], uB: units[i+1]||null, win: null});
        if(type==='pairs') pairsT = {rounds:[matches]}; else singlesT = {rounds:[matches]};
        saveData(); renderMatchplay(type);
    }

    function resetT(type) { if(type==='pairs') pairsT=null; else singlesT=null; saveData(); renderMatchplay(type); }

    function renderDoublesSelector() {
        document.getElementById('doubles-selector').innerHTML = players.map(p => `<div class="selector-item">${p.name} <input type="checkbox" class="db-ck" value="${p.id}"></div>`).join('');
    }

    function setupDoublesTeams() {
        const ids = Array.from(document.querySelectorAll('.db-ck:checked')).map(c => c.value);
        tempTeams = [];
        for(let i=0; i<ids.length; i+=2) {
            if(ids[i+1]) tempTeams.push({p1: players.find(p=>p.id==ids[i]), p2: players.find(p=>p.id==ids[i+1])});
        }
        document.getElementById('doubles-scorecards').innerHTML = tempTeams.map((t, i) => `<div class="team-box">${t.p1.name} & ${t.p2.name} <input type="number" class="db-pts" data-i="${i}"></div>`).join('');
        document.getElementById('db-step1').classList.add('hidden'); document.getElementById('db-step2').classList.remove('hidden');
    }

    function calculateDoublesResults() {
        const inputs = document.querySelectorAll('.db-pts');
        let out = "";
        inputs.forEach((input, i) => {
            out += `<div class="item-row">${tempTeams[i].p1.name} & ${tempTeams[i].p2.name}: ${input.value} pts</div>`;
        });
        document.getElementById('doubles-output').innerHTML = out;
    }

    function parseDate(s) { const p = s.split('/'); return `${p[2]}-${p[1]}-${p[0]}`; }
    function formatDate(s) { const p = s.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
    function applyClubProfile() { document.getElementById('header-club-name').innerText = club.name; }
    function saveClubProfile() { club.name = document.getElementById('setupClubName').value; saveData(); applyClubProfile(); }
    function processLogo(i) { /* logo logic */ }
    function updateSeasonDropdown() { document.getElementById('dashSeason').innerHTML = `<option>${new Date().getFullYear()}</option>`; }
    function factoryReset() { if(confirm("Wipe all?")) { localStorage.clear(); location.reload(); } }
    function renderPastComps() {
        document.getElementById('past-tourney-list').innerHTML = pastComps.map(c => `<div class="item-row">${c.winner} - ${c.type}</div>`).join('');
    }
</script>
</body>
</html>
