<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; --info: #0277bd; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        
        /* UI Elements */
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        #club-logo-display { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }
        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav button { flex: 1; min-width: 70px; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-share { background: #673ab7; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        
        /* Report View */
        #share-report-area { background: white; padding: 20px; color: #000; }
        .report-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .report-table th { background: #f0f0f0; border: 1px solid #ddd; padding: 8px; text-align: left; }
        .report-table td { border: 1px solid #ddd; padding: 8px; }

        .score-grid { grid-template-columns: repeat(6, 1fr); display: grid; gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 10px; }
        .hole-input input { padding: 4px 0; text-align: center; width: 100% !important; }

        @media print {
            .nav, .header, .btn, .btn-outline, .btn-del, .no-print, input, select { display: none !important; }
            .container { padding: 0; max-width: 100%; }
            #share-report-area { display: block !important; }
        }
    </style>
</head>
<body onload="init()">

<div class="header no-print">
    <img id="club-logo-display" src="" alt="Logo">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav no-print">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Round</button>
    <button onclick="showTab('tab-stats')" id="btn-stats">Stats</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- DASHBOARD / HISTORY -->
    <div id="tab-dash" class="tab-content">
        <div id="dash-main-view">
            <div class="card">
                <h3>Round History</h3>
                <select id="dashSeason" onchange="renderDashboard()"></select>
                <div id="dash-list"></div>
            </div>
        </div>

        <div id="dash-detail" class="hidden card">
            <div class="no-print">
                <button class="btn-outline" onclick="closeDetail()">← Back</button>
                <button class="btn-share" onclick="window.print()">Print/Share Report</button>
                <hr>
            </div>
            <div id="share-report-area">
                <div class="report-header">
                    <h2 id="report-club-name"></h2>
                    <h3 id="report-round-title"></h3>
                    <p id="report-date"></p>
                </div>
                <table class="report-table">
                    <thead><tr><th>Pos</th><th>Player</th><th>Points</th></tr></thead>
                    <tbody id="report-leaderboard-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ROUND ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3>Record Round Score</h3>
            <input type="text" id="rDate" placeholder="dd/mm/yyyy">
            <select id="rCourse"><option value="">Select Course</option></select>
            <select id="rPlayer"><option value="">Select Player</option></select>
            <div class="score-grid" id="round-scores"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
        </div>
    </div>

    <!-- STATS -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="card">
            <h3>All Historical Rounds</h3>
            <div id="stats-list"></div>
        </div>
    </div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Profile</h3>
            <input type="text" id="setupClubName" placeholder="Club Name">
            <input type="file" accept="image/*" onchange="processLogo(this)">
            <button class="btn" onclick="saveClubProfile()">Update Club</button>
        </div>
        <div class="card">
            <h3>Add New Player</h3>
            <input type="text" id="pName" placeholder="Player Name">
            <input type="number" id="pHC" placeholder="Handicap">
            <button class="btn" onclick="savePlayer()">Add Player</button>
            <div id="admin-players"></div>
        </div>
        <div class="card">
            <h3>Add New Course</h3>
            <input type="text" id="cName" placeholder="Course Name">
            <div class="score-grid" id="setup-pars"></div>
            <div class="score-grid" id="setup-si"></div>
            <button class="btn" onclick="saveCourse()">Add Course</button>
            <div id="admin-courses"></div>
        </div>
        <div class="card">
            <h3>Data Management</h3>
            <button class="btn-outline" style="width:100%" onclick="exportFullData()">Download Full Backup (JSON)</button>
            <button class="btn-del" style="width:100%; margin-top:10px;" onclick="factoryReset()">Wipe Data</button>
        </div>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], club = { name: "Golf Pro Manager", logo: "" };

    function loadData() {
        players = JSON.parse(localStorage.getItem('g_players')) || [];
        courses = JSON.parse(localStorage.getItem('g_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g_rounds')) || [];
        club = JSON.parse(localStorage.getItem('g_club')) || { name: "Golf Pro Manager", logo: "" };
    }

    function saveData() {
        localStorage.setItem('g_players', JSON.stringify(players));
        localStorage.setItem('g_courses', JSON.stringify(courses));
        localStorage.setItem('g_rounds', JSON.stringify(rounds));
        localStorage.setItem('g_club', JSON.stringify(club));
    }

    function init() {
        loadData();
        setupInputGrids();
        applyClubProfile();
        updateSeasonDropdown();
        showTab('tab-dash');
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'tab-setup') renderAdmin();
        if(id === 'tab-dash') renderDashboard();
        if(id === 'tab-comp') populateSelectors();
        if(id === 'tab-stats') renderStats();
    }

    // ADMIN FUNCTIONS
    function savePlayer() {
        const name = document.getElementById('pName').value;
        const hc = document.getElementById('pHC').value;
        if(!name) return;
        players.push({ id: Date.now(), name, handicap: hc });
        saveData(); renderAdmin();
        document.getElementById('pName').value = ''; document.getElementById('pHC').value = '';
    }

    function saveCourse() {
        const name = document.getElementById('cName').value;
        if(!name) return;
        const pars = Array.from(document.querySelectorAll('.setup-pars-val')).map(i => i.value || 4);
        const si = Array.from(document.querySelectorAll('.setup-si-val')).map(i => i.value || 1);
        courses.push({ id: Date.now(), name, pars, si });
        saveData(); renderAdmin();
        document.getElementById('cName').value = '';
    }

    function renderAdmin() {
        document.getElementById('admin-players').innerHTML = players.map(p => `<div class="item-row">${p.name} (HC:${p.handicap}) <button class="btn-del" onclick="deleteItem('players', ${p.id})">X</button></div>`).join('');
        document.getElementById('admin-courses').innerHTML = courses.map(c => `<div class="item-row">${c.name} <button class="btn-del" onclick="deleteItem('courses', ${c.id})">X</button></div>`).join('');
    }

    function deleteItem(type, id) {
        if(type === 'players') players = players.filter(p => p.id !== id);
        if(type === 'courses') courses = courses.filter(c => c.id !== id);
        saveData(); renderAdmin();
    }

    // ROUND LOGIC
    function saveRound() {
        const cId = document.getElementById('rCourse').value;
        const pId = document.getElementById('rPlayer').value;
        if(!cId || !pId) return alert("Select Player and Course");

        const crs = courses.find(c => c.id == cId);
        const plr = players.find(p => p.id == pId);
        const scs = Array.from(document.querySelectorAll('.round-scores-val')).map(i => parseInt(i.value) || 0);
        
        // Basic Stableford
        let pts = 0;
        scs.forEach((s, i) => {
            if(s > 0) {
                let allow = Math.floor(plr.handicap/18) + (plr.handicap%18 >= crs.si[i] ? 1 : 0);
                pts += Math.max(0, parseInt(crs.pars[i]) - (s - allow) + 2);
            }
        });

        rounds.push({
            id: Date.now(),
            date: document.getElementById('rDate').value || new Date().toLocaleDateString(),
            courseId: cId, courseName: crs.name,
            playerId: pId, playerName: plr.name,
            points: pts, scores: scs,
            season: new Date().getFullYear().toString()
        });

        saveData();
        alert("Saved!");
        showTab('tab-dash');
    }

    function renderDashboard() {
        const grouped = rounds.reduce((acc, r) => {
            const key = `${r.date}|${r.courseId}`;
            if (!acc[key]) acc[key] = { date: r.date, course: r.courseName, id: r.courseId, count: 0 };
            acc[key].count++;
            return acc;
        }, {});
        document.getElementById('dash-list').innerHTML = Object.values(grouped).map(g => `
            <div class="item-row" onclick="viewShareableReport('${g.date}','${g.id}')">
                <span><b>${g.course}</b><br><small>${g.date}</small></span>
                <span>${g.count} Players ></span>
            </div>`).join('');
    }

    function viewShareableReport(date, cid) {
        document.getElementById('dash-main-view').classList.add('hidden');
        document.getElementById('dash-detail').classList.remove('hidden');
        const filtered = rounds.filter(r => r.date === date && r.courseId == cid).sort((a,b)=>b.points-a.points);
        
        document.getElementById('report-club-name').innerText = club.name;
        document.getElementById('report-round-title').innerText = filtered[0].courseName;
        document.getElementById('report-date').innerText = date;
        document.getElementById('report-leaderboard-body').innerHTML = filtered.map((r, i) => `<tr><td>${i+1}</td><td>${r.playerName}</td><td><b>${r.points}</b></td></tr>`).join('');
    }

    // HELPERS
    function setupInputGrids() {
        ['round-scores', 'setup-pars', 'setup-si'].forEach(id => {
            const el = document.getElementById(id); el.innerHTML = '';
            for(let i=1; i<=18; i++) el.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="${id}-val"></div>`;
        });
        const now = new Date();
        document.getElementById('rDate').value = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
    }

    function populateSelectors() {
        document.getElementById('rCourse').innerHTML = '<option value="">Course...</option>' + courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('rPlayer').innerHTML = '<option value="">Player...</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function closeDetail() { document.getElementById('dash-main-view').classList.remove('hidden'); document.getElementById('dash-detail').classList.add('hidden'); }
    function applyClubProfile() { document.getElementById('header-club-name').innerText = club.name; document.getElementById('setupClubName').value = club.name; if(club.logo) document.getElementById('club-logo-display').src = club.logo; }
    function saveClubProfile() { club.name = document.getElementById('setupClubName').value; saveData(); applyClubProfile(); }
    function processLogo(input) { const reader = new FileReader(); reader.onload = e => { club.logo = e.target.result; saveData(); applyClubProfile(); }; if(input.files[0]) reader.readAsDataURL(input.files[0]); }
    function updateSeasonDropdown() { document.getElementById('dashSeason').innerHTML = `<option>${new Date().getFullYear()} Season</option>`; }
    function factoryReset() { if(confirm("Wipe everything?")) { localStorage.clear(); location.reload(); } }
    function exportFullData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({club, players, courses, rounds}));
        const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "golf_backup.json"); dl.click();
    }
</script>

</body>
</html>
