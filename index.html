<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Tournament Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        
        /* Header */
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }

        /* Navigation & Dropdown */
        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; }
        .nav button, .dropbtn { flex: 1; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-bottom: 4px solid transparent; transition: 0.3s; }
        .nav button.active, .dropbtn.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        
        .dropdown { flex: 1; position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: var(--primary); min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1001; top: 100%; left: 0; }
        .dropdown-content button { text-align: left; width: 100%; padding: 12px 15px; border: none; color: white; background: none; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .dropdown-content button:hover { background-color: rgba(255,255,255,0.2); }
        .dropdown:hover .dropdown-content { display: block; }

        /* Main Layout */
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        /* Forms */
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-del { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; width: auto; font-size: 11px; }
        
        /* Lists & Grids */
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 10px; }
        .hole-input input { padding: 4px 0; text-align: center; width: 100% !important; }

        @media print { .nav, .btn, .btn-del, .btn-outline, .header { display: none !important; } }
    </style>
</head>
<body onload="init()">

<div class="header">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Round</button>
    
    <div class="dropdown">
        <button class="dropbtn" id="btn-comps">Comps ▾</button>
        <div class="dropdown-content">
            <button onclick="showTab('tab-doubles')">Doubles</button>
            <button onclick="showTab('tab-pairs')">Pairs (KO)</button>
            <button onclick="showTab('tab-singles')">Singles (KO)</button>
        </div>
    </div>

    <button onclick="showTab('tab-stats')" id="btn-stats">Stats</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- HISTORY -->
    <div id="tab-dash" class="tab-content">
        <div class="card">
            <h3>Recent Activity</h3>
            <div id="dash-list"></div>
        </div>
    </div>

    <!-- ROUND ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3>Record Round</h3>
            <input type="text" id="rDate" placeholder="Date (dd/mm/yyyy)">
            <select id="rCourse"><option value="">Select Course</option></select>
            <select id="rPlayer"><option value="">Select Player</option></select>
            <div class="score-grid" id="score-grid-container"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
        </div>
    </div>

    <!-- TOURNAMENT TABS -->
    <div id="tab-doubles" class="tab-content hidden"><div class="card"><h3>Doubles Tournament</h3><div id="doubles-content">Coming Soon...</div></div></div>
    <div id="tab-pairs" class="tab-content hidden"><div class="card"><h3>Pairs Matchplay</h3><div id="pairs-content">Coming Soon...</div></div></div>
    <div id="tab-singles" class="tab-content hidden"><div class="card"><h3>Singles Matchplay</h3><div id="singles-content">Coming Soon...</div></div></div>

    <!-- STATS -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="card">
            <h3>Player Rankings</h3>
            <div id="stats-list"></div>
        </div>
    </div>

    <!-- SETUP (BACKUP/RESTORE RESTORED) -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Profile</h3>
            <input type="text" id="setupClubName" placeholder="Club Name">
            <button class="btn" onclick="saveClubName()">Update Name</button>
        </div>

        <div class="card">
            <h3>Data Backup & Restore</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Save your data to a file or restore from a backup.</p>
            <button class="btn-outline" style="width:100%; margin-bottom: 10px;" onclick="backupData()">Download Backup (.json)</button>
            <hr>
            <input type="file" id="restoreFile" accept=".json">
            <button class="btn-outline" style="width:100%" onclick="restoreData()">Upload & Restore Backup</button>
        </div>

        <div class="card">
            <h3>Player Registry</h3>
            <input type="text" id="regPName" placeholder="Player Name">
            <input type="number" id="regPHC" placeholder="Handicap">
            <button class="btn" onclick="addPlayer()">Add Player</button>
            <div id="list-players"></div>
        </div>

        <div class="card">
            <h3>Course Registry</h3>
            <input type="text" id="regCName" placeholder="Course Name">
            <button class="btn" onclick="addCourse()">Add Course</button>
            <div id="list-courses"></div>
        </div>

        <button class="btn-del" style="width:100%; margin-top: 20px;" onclick="factoryReset()">Factory Reset (Delete All)</button>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], club = {name: "Golf Pro Manager"};

    function init() {
        loadLocalStorage();
        renderScoreInputs();
        updateClubDisplay();
        showTab('tab-dash');
    }

    function loadLocalStorage() {
        players = JSON.parse(localStorage.getItem('golf_players')) || [];
        courses = JSON.parse(localStorage.getItem('golf_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('golf_rounds')) || [];
        club = JSON.parse(localStorage.getItem('golf_club')) || {name: "Golf Pro Manager"};
    }

    function saveLocalStorage() {
        localStorage.setItem('golf_players', JSON.stringify(players));
        localStorage.setItem('golf_courses', JSON.stringify(courses));
        localStorage.setItem('golf_rounds', JSON.stringify(rounds));
        localStorage.setItem('golf_club', JSON.stringify(club));
    }

    // BACKUP AND RESTORE FUNCTIONS
    function backupData() {
        const data = { players, courses, rounds, club };
        const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `golf_manager_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function restoreData() {
        const file = document.getElementById('restoreFile').files[0];
        if(!file) return alert("Please select a file first.");
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if(confirm("This will overwrite all current data. Proceed?")) {
                    players = data.players || [];
                    courses = data.courses || [];
                    rounds = data.rounds || [];
                    club = data.club || {name: "Golf Pro Manager"};
                    saveLocalStorage();
                    location.reload();
                }
            } catch(err) { alert("Error reading file. Ensure it is a valid backup."); }
        };
        reader.readAsText(file);
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.nav button, .dropbtn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(id).classList.remove('hidden');
        
        // Handle dropdown highlighting
        if(['tab-doubles', 'tab-pairs', 'tab-singles'].includes(id)) {
            document.getElementById('btn-comps').classList.add('active');
        } else {
            const activeBtn = document.getElementById('btn-' + id.split('-')[1]);
            if(activeBtn) activeBtn.classList.add('active');
        }

        if(id === 'tab-setup') renderRegistry();
        if(id === 'tab-dash') renderDash();
        if(id === 'tab-comp') populateSelectors();
        if(id === 'tab-stats') renderStats();
    }

    function renderScoreInputs() {
        const container = document.getElementById('score-grid-container');
        container.innerHTML = '';
        for(let i=1; i<=18; i++) {
            container.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="h-val"></div>`;
        }
    }

    function populateSelectors() {
        document.getElementById('rCourse').innerHTML = '<option value="">Select Course</option>' + courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('rPlayer').innerHTML = '<option value="">Select Player</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function saveRound() {
        const pId = document.getElementById('rPlayer').value;
        const cId = document.getElementById('rCourse').value;
        const date = document.getElementById('rDate').value;
        if(!pId || !cId || !date) return alert("Fill all fields");

        let total = 0;
        document.querySelectorAll('.h-val').forEach(input => total += (parseInt(input.value) || 0));

        rounds.push({
            id: Date.now(),
            pName: players.find(p => p.id == pId).name,
            cName: courses.find(c => c.id == cId).name,
            date: date,
            score: total
        });
        saveLocalStorage();
        alert("Round Saved!");
    }

    function renderRegistry() {
        document.getElementById('list-players').innerHTML = players.map(p => `<div class="item-row">${p.name} (${p.hc}) <button class="btn-del" onclick="delPlayer(${p.id})">X</button></div>`).join('');
        document.getElementById('list-courses').innerHTML = courses.map(c => `<div class="item-row">${c.name} <button class="btn-del" onclick="delCourse(${c.id})">X</button></div>`).join('');
    }

    function addPlayer() {
        const name = document.getElementById('regPName').value;
        const hc = document.getElementById('regPHC').value;
        if(name) { players.push({id: Date.now(), name, hc}); saveLocalStorage(); renderRegistry(); }
    }

    function delPlayer(id) { players = players.filter(p => p.id != id); saveLocalStorage(); renderRegistry(); }

    function addCourse() {
        const name = document.getElementById('regCName').value;
        if(name) { courses.push({id: Date.now(), name}); saveLocalStorage(); renderRegistry(); }
    }

    function delCourse(id) { courses = courses.filter(c => c.id != id); saveLocalStorage(); renderRegistry(); }

    function renderDash() {
        document.getElementById('dash-list').innerHTML = rounds.slice().reverse().map(r => `<div class="item-row"><b>${r.pName}</b> <span>${r.cName} - ${r.score}pts</span></div>`).join('');
    }

    function renderStats() {
        document.getElementById('stats-list').innerHTML = rounds.sort((a,b) => b.score - a.score).map(r => `<div class="item-row"><span>${r.pName}</span><span>${r.score}</span></div>`).join('');
    }

    function saveClubName() { club.name = document.getElementById('setupClubName').value; saveLocalStorage(); updateClubDisplay(); }
    function updateClubDisplay() { document.getElementById('header-club-name').innerText = club.name; }
    function factoryReset() { if(confirm("WIPE EVERYTHING?")) { localStorage.clear(); location.reload(); } }
</script>

</body>
</html>
