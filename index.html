<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --info: #0277bd; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; padding-bottom: 50px; }
        
        .header { background: white; padding: 10px 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; min-height: 60px; }
        #club-logo-img { max-height: 50px; max-width: 80px; object-fit: contain; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }

        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav button { flex: 1; min-width: 80px; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        label { font-size: 13px; font-weight: bold; color: #555; margin-top: 10px; display: block; }

        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        .selector-list { border: 1px solid #ddd; padding: 5px; border-radius: 8px; max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; }
        .hole-input label { font-size: 9px; display: block; color: #777; }
        .hole-input input { padding: 4px; text-align: center; margin: 0; font-size: 12px; }

        .team-card { border-left: 5px solid var(--primary); background: #f9f9f9; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .team-names { font-size: 14px; font-weight: bold; }
        .team-score { font-size: 18px; color: var(--primary); font-weight: 900; }
    </style>
</head>
<body>

<div class="header">
    <img id="club-logo-img" src="" alt="Logo">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-leaderboard')" id="btn-leaderboard">Leaderboard</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Enter Score</button>
    <button onclick="showTab('tab-daily-doubles')" id="btn-daily-doubles">Doubles (Daily)</button>
    <button onclick="showTab('tab-pairs')" id="btn-pairs">Pairs KO</button>
    <button onclick="showTab('tab-singles')" id="btn-singles">Singles KO</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- DASHBOARD -->
    <div id="tab-dash" class="tab-content">
        <div class="card">
            <h3>Historical Results</h3>
            <select id="historyDropdown" onchange="renderHistoryBySelection()"></select>
            <div id="history-results-list"></div>
        </div>
    </div>

    <!-- LEADERBOARD -->
    <div id="tab-leaderboard" class="tab-content hidden">
        <div class="card"><h3>Today's Individual Leaderboard</h3><div id="leaderboard-display"></div></div>
    </div>

    <!-- DAILY DOUBLES -->
    <div id="tab-daily-doubles" class="tab-content hidden">
        <div class="card">
            <h3>Daily Doubles Competition</h3>
            <div id="dd-setup">
                <p>Select players for today's random teams:</p>
                <div id="dd-selector" class="selector-list"></div>
                <button class="btn" onclick="generateDailyTeams()">Generate Teams</button>
            </div>
            <div id="dd-active" class="hidden">
                <div style="display:flex; gap:10px;">
                    <button class="btn" style="flex:2" onclick="importDailyScores()">Import Today's Scores</button>
                    <button class="btn-del" style="flex:1" onclick="resetDailyDoubles()">Reset Teams</button>
                </div>
                <div id="dd-results" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <!-- SCORE ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3>Enter Scorecard</h3>
            <label>Date</label><input type="date" id="rDate">
            <label>Course</label><select id="rCourse"></select>
            <label>Player</label><select id="rPlayer"></select>
            <div class="score-grid" id="round-scores"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
        </div>
    </div>

    <!-- KNOCKOUTS (Pairs/Singles) -->
    <div id="tab-pairs" class="tab-content hidden"><div class="card"><h3>Pairs Knockout</h3><div id="pairs-setup"></div><div id="pairs-bracket"></div></div></div>
    <div id="tab-singles" class="tab-content hidden"><div class="card"><h3>Singles Knockout</h3><div id="singles-setup"></div><div id="singles-bracket"></div></div></div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Branding</h3>
            <input type="text" id="setupClubName" placeholder="Club Name">
            <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(this)">
            <button class="btn" onclick="saveClubProfile()">Update Branding</button>
        </div>
        <div class="card">
            <h3>Player Registry</h3>
            <input type="text" id="pName" placeholder="Player Name">
            <input type="number" id="pHC" placeholder="Handicap">
            <button class="btn" onclick="savePlayer()">Add Player</button>
            <div id="admin-players"></div>
        </div>
        <div class="card">
            <h3>Course Registry</h3>
            <input type="text" id="cName" placeholder="Course Name">
            <div class="score-grid" id="setup-pars"></div>
            <div class="score-grid" id="setup-si"></div>
            <button class="btn" onclick="saveCourse()">Add Course</button>
            <div id="admin-courses"></div>
        </div>
        <button class="btn-del" style="width:100%" onclick="factoryReset()">Wipe All Data</button>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], dailyTeams = [], club = { name: "Golf Pro Manager", logo: "" };

    function loadData() {
        players = JSON.parse(localStorage.getItem('g_players')) || [];
        courses = JSON.parse(localStorage.getItem('g_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g_rounds')) || [];
        dailyTeams = JSON.parse(localStorage.getItem('g_dailyTeams')) || [];
        club = JSON.parse(localStorage.getItem('g_club')) || { name: "Golf Pro Manager", logo: "" };
    }

    function saveData() {
        localStorage.setItem('g_players', JSON.stringify(players));
        localStorage.setItem('g_courses', JSON.stringify(courses));
        localStorage.setItem('g_rounds', JSON.stringify(rounds));
        localStorage.setItem('g_dailyTeams', JSON.stringify(dailyTeams));
        localStorage.setItem('g_club', JSON.stringify(club));
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('btn-' + id.replace('tab-','')).classList.add('active');
        loadData();
        applyClubProfile();
        if(id === 'tab-daily-doubles') renderDailyDoubles();
        if(id === 'tab-setup') renderAdmin();
        if(id === 'tab-leaderboard') renderLeaderboard();
        if(id === 'tab-comp') {
            document.getElementById('rCourse').innerHTML = courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('rPlayer').innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('rDate').value = new Date().toISOString().split('T')[0];
        }
    }

    // --- DAILY DOUBLES LOGIC ---
    function renderDailyDoubles() {
        const setup = document.getElementById('dd-setup');
        const active = document.getElementById('dd-active');
        
        if (dailyTeams.length === 0) {
            setup.classList.remove('hidden');
            active.classList.add('hidden');
            document.getElementById('dd-selector').innerHTML = players.map(p => `
                <div class="item-row">
                    <span>${p.name}</span>
                    <input type="checkbox" class="dd-ck" value="${p.id}" style="width:20px">
                </div>
            `).join('');
        } else {
            setup.classList.add('hidden');
            active.classList.remove('hidden');
            renderDailyResults();
        }
    }

    function generateDailyTeams() {
        const ids = Array.from(document.querySelectorAll('.dd-ck:checked')).map(i => i.value);
        if (ids.length < 2) return alert("Select at least 2 players");
        
        const shuf = ids.sort(() => 0.5 - Math.random());
        dailyTeams = [];
        for (let i = 0; i < shuf.length; i += 2) {
            const p1 = players.find(p => p.id == shuf[i]);
            const p2 = players.find(p => p.id == shuf[i + 1]);
            dailyTeams.push({
                p1Name: p1.name,
                p2Name: p2 ? p2.name : "Solo",
                score: 0
            });
        }
        saveData();
        renderDailyDoubles();
    }

    function importDailyScores() {
        const today = new Date().toISOString().split('T')[0];
        const todaysRounds = rounds.filter(r => r.date === today);

        if (todaysRounds.length === 0) return alert("No scores found for today's date yet.");

        dailyTeams.forEach(team => {
            const s1 = todaysRounds.find(r => r.playerName === team.p1Name)?.points || 0;
            const s2 = todaysRounds.find(r => r.playerName === team.p2Name)?.points || 0;
            team.score = s1 + s2;
        });

        dailyTeams.sort((a, b) => b.score - a.score);
        saveData();
        renderDailyResults();
    }

    function renderDailyResults() {
        const cont = document.getElementById('dd-results');
        cont.innerHTML = "<h4>Live Doubles Leaderboard</h4>" + dailyTeams.map((t, i) => `
            <div class="team-card">
                <div class="team-names">${i+1}. ${t.p1Name} & ${t.p2Name}</div>
                <div class="team-score">${t.score} pts</div>
            </div>
        `).join('');
    }

    function resetDailyDoubles() {
        if(confirm("Reset teams?")) { dailyTeams = []; saveData(); renderDailyDoubles(); }
    }

    // --- STANDARD CORE LOGIC ---
    function savePlayer() {
        const name = document.getElementById('pName').value;
        const hc = document.getElementById('pHC').value;
        if(!name) return;
        players.push({id:Date.now(), name, handicap:hc});
        saveData(); document.getElementById('pName').value=''; renderAdmin();
    }

    function saveRound() {
        const cId = document.getElementById('rCourse').value, pId = document.getElementById('rPlayer').value;
        const crs = courses.find(c=>c.id==cId), plr = players.find(p=>p.id==pId);
        const scs = Array.from(document.querySelectorAll('.round-scores-val')).map(i=>parseInt(i.value)||0);
        let pts = 0;
        scs.forEach((s, i) => {
            if(s>0){
                const par = parseInt(crs.pars[i]), si = parseInt(crs.si[i]), hc = parseInt(plr.handicap);
                const allow = Math.floor(hc/18) + (hc%18 >= si ? 1 : 0);
                pts += Math.max(0, par - (s - allow) + 2);
            }
        });
        rounds.push({id:Date.now(), date:document.getElementById('rDate').value, playerName:plr.name, points:pts});
        saveData(); alert("Score Saved!"); showTab('tab-leaderboard');
    }

    function renderLeaderboard() {
        const t = new Date().toISOString().split('T')[0];
        const f = rounds.filter(r=>r.date===t).sort((a,b)=>b.points-a.points);
        document.getElementById('leaderboard-display').innerHTML = f.length ? f.map(r=>`<div class="item-row"><span>${r.playerName}</span><b>${r.points} pts</b></div>`).join('') : "No scores entered today.";
    }

    function renderAdmin() {
        document.getElementById('admin-players').innerHTML = players.map(p => `<div class="item-row">${p.name} (HC: ${p.handicap})</div>`).join('');
        document.getElementById('admin-courses').innerHTML = courses.map(c => `<div class="item-row">${c.name}</div>`).join('');
    }

    function saveCourse() {
        const p = Array.from(document.querySelectorAll('.setup-pars-val')).map(i=>i.value);
        const s = Array.from(document.querySelectorAll('.setup-si-val')).map(i=>i.value);
        courses.push({id:Date.now(), name:document.getElementById('cName').value, pars:p, si:s});
        saveData(); renderAdmin();
    }

    function handleLogoUpload(input) {
        const reader = new FileReader();
        reader.onload = (e) => { club.logo = e.target.result; };
        reader.readAsDataURL(input.files[0]);
    }

    function saveClubProfile() {
        club.name = document.getElementById('setupClubName').value;
        saveData(); applyClubProfile();
    }

    function applyClubProfile() {
        document.getElementById('header-club-name').innerText = club.name;
        if(club.logo) { document.getElementById('club-logo-img').src = club.logo; document.getElementById('club-logo-img').style.display='block'; }
    }

    function setupInputGrids() { ['round-scores', 'setup-pars', 'setup-si'].forEach(g => { const el = document.getElementById(g); for(let i=1; i<=18; i++) el.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="${g}-val"></div>`; }); }
    function factoryReset() { if(confirm("Wipe all?")) { localStorage.clear(); location.reload(); }}
    window.onload = () => { loadData(); setupInputGrids(); showTab('tab-dash'); };
</script>
</body>
</html>
