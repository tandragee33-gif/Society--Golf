<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Tournament Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; --info: #0288d1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        #club-logo-display { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }
        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav button { flex: 1; min-width: 70px; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 10px; }
        .hole-input input { padding: 4px 0; text-align: center; width: 100% !important; }
        .selector-list { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 8px; }
        .selector-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .match-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; background: #fff; border-left: 5px solid var(--accent); }
        .winner-row { background: #e8f5e9; font-weight: bold; color: #2e7d32; padding: 4px; border-radius: 4px; }
        .team-box { background: #f9f9f9; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body onload="init()">

<div class="header no-print">
    <img id="club-logo-display" src="" alt="Logo">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav no-print">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Round</button>
    <button onclick="showTab('tab-team')" id="btn-team">Team</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- DASHBOARD -->
    <div id="tab-dash" class="tab-content">
        <div class="card">
            <h3>Recent Activity</h3>
            <div id="dash-list"></div>
        </div>
    </div>

    <!-- ROUND ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3>New Round</h3>
            <input type="text" id="rDate" placeholder="dd/mm/yyyy">
            <select id="rCourse"><option value="">Select Course</option></select>
            <select id="rPlayer"><option value="">Select Player</option></select>
            <div class="score-grid" id="round-scores"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
        </div>
    </div>

    <!-- TEAM TAB -->
    <div id="tab-team" class="tab-content hidden">
        <div class="card">
            <h3>Team Competition</h3>
            <label>Match Date:</label>
            <input type="text" id="tmDate" placeholder="dd/mm/yyyy">
            <div id="team-selector" class="selector-list"></div>
            <button class="btn" onclick="addTeam()">Add Team</button>
            <div id="tm-active-teams" style="margin-top:20px;"></div>
            <button class="btn" style="background:var(--success)" onclick="calculateTeamResults()">Calculate Leaderboard</button>
            <button class="btn-del" style="width:100%" onclick="resetTeamComp()">Reset</button>
            <div id="team-results-output"></div>
        </div>
    </div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Add Player</h3>
            <input type="text" id="pName" placeholder="Player Name">
            <button class="btn" onclick="savePlayer()">Add Player</button>
            <div id="admin-players"></div>
        </div>
        <div class="card">
            <h3>Add Course</h3>
            <input type="text" id="cName" placeholder="Course Name">
            <div class="score-grid" id="setup-pars"></div>
            <button class="btn" onclick="saveCourse()">Add Course</button>
        </div>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], competitionTeams = [];

    function init() {
        loadData();
        setupInputGrids();
        showTab('tab-dash');
    }

    function loadData() {
        players = JSON.parse(localStorage.getItem('g_players')) || [];
        courses = JSON.parse(localStorage.getItem('g_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g_rounds')) || [];
    }

    function saveData() {
        localStorage.setItem('g_players', JSON.stringify(players));
        localStorage.setItem('g_courses', JSON.stringify(courses));
        localStorage.setItem('g_rounds', JSON.stringify(rounds));
    }

    function setupInputGrids() {
        ['round-scores', 'setup-pars'].forEach(g => {
            const el = document.getElementById(g);
            el.innerHTML = '';
            for(let i=1; i<=18; i++) {
                el.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="${g}-val"></div>`;
            }
        });
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'tab-team') renderTeamSelector();
        if(id === 'tab-comp') populateSelectors();
        if(id === 'tab-setup') renderAdmin();
    }

    function populateSelectors() {
        document.getElementById('rCourse').innerHTML = '<option>Select Course</option>' + courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('rPlayer').innerHTML = '<option>Select Player</option>' + players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function savePlayer() {
        const name = document.getElementById('pName').value;
        if(!name) return;
        players.push({id: Date.now(), name: name});
        saveData();
        renderAdmin();
    }

    function saveCourse() {
        const name = document.getElementById('cName').value;
        const pars = Array.from(document.querySelectorAll('.setup-pars-val')).map(i => parseInt(i.value) || 4);
        courses.push({id: Date.now(), name: name, pars: pars});
        saveData();
        alert("Course Saved");
    }

    function saveRound() {
        const pId = document.getElementById('rPlayer').value;
        const cId = document.getElementById('rCourse').value;
        const date = document.getElementById('rDate').value;
        const course = courses.find(c => c.id == cId);
        
        let holePoints = [];
        let total = 0;
        document.querySelectorAll('.round-scores-val').forEach((input, i) => {
            let s = parseInt(input.value) || 0;
            let p = Math.max(0, (course.pars[i] + 2) - s); // Basic Stableford
            holePoints.push(p);
            total += p;
        });

        rounds.push({
            playerName: players.find(p => p.id == pId).name,
            date: date,
            pointsArray: holePoints,
            points: total
        });
        saveData();
        alert("Saved!");
    }

    function renderTeamSelector() {
        document.getElementById('team-selector').innerHTML = players.map(p => `
            <div class="selector-item">${p.name} <input type="checkbox" class="tm-ck" value="${p.id}"></div>
        `).join('');
    }

    function addTeam() {
        const selected = Array.from(document.querySelectorAll('.tm-ck:checked')).map(ck => players.find(p => p.id == ck.value));
        if(selected.length !== 4) return alert("Select 4 players");
        competitionTeams.push({id: competitionTeams.length+1, members: selected});
        renderActiveTeams();
    }

    function renderActiveTeams() {
        document.getElementById('tm-active-teams').innerHTML = competitionTeams.map(t => `<div class="team-box">Team ${t.id}: ${t.members.map(m=>m.name).join(', ')}</div>`).join('');
    }

    function calculateTeamResults() {
        const date = document.getElementById('tmDate').value;
        const results = competitionTeams.map(team => {
            let total = 0;
            for(let i=0; i<18; i++) {
                let pts = team.members.map(m => {
                    const r = rounds.find(rd => rd.date === date && rd.playerName === m.name);
                    return r ? r.pointsArray[i] : 0;
                }).sort((a,b) => b-a);
                total += (i === 8 || i === 17) ? pts.reduce((a,b)=>a+b,0) : (pts[0] + pts[1]);
            }
            return {name: `Team ${team.id}`, score: total};
        });
        document.getElementById('team-results-output').innerHTML = results.map(r => `<div>${r.name}: ${r.score} pts</div>`).join('');
    }

    function resetTeamComp() {
        competitionTeams = [];
        document.getElementById('tm-active-teams').innerHTML = "";
        document.getElementById('team-results-output').innerHTML = "";
    }

    function renderAdmin() {
        document.getElementById('admin-players').innerHTML = players.map(p => `<div>${p.name}</div>`).join('');
    }
</script>
</body>
</html>
