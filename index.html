<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Ultimate Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; background: #eaeff2; color: var(--dark); line-height: 1.5; }
        
        /* Navigation & Header */
        .header { background: white; padding: 1rem; border-bottom: 4px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.4rem; text-align: center; }

        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .nav button, .dropbtn { flex: 1; min-width: 80px; padding: 15px 5px; border: none; background: none; color: white; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s; border-bottom: 4px solid transparent; }
        .nav button.active, .dropbtn.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.15); }
        
        .dropdown { flex: 1; position: relative; }
        .dropdown-content { display: none; position: absolute; background: var(--primary); min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); z-index: 1001; top: 100%; border-radius: 0 0 8px 8px; }
        .dropdown-content button { text-align: left; width: 100%; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .dropdown:hover .dropdown-content { display: block; }

        /* Layout */
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #dee2e6; }
        .hidden { display: none !important; }
        
        /* Forms */
        h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; color: #666; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ccd1d9; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-del { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        /* Scoring Grid */
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
        .hole-input { text-align: center; }
        .hole-input label { display: block; margin-bottom: 4px; font-weight: 900; color: var(--primary); }
        .hole-input input { padding: 8px 0; text-align: center; margin: 0; font-weight: bold; }

        /* Lists & Tables */
        .item-row { padding: 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .item-row:last-child { border: none; }
        .badge { background: var(--accent); color: var(--dark); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fa; padding: 12px; font-size: 13px; color: #666; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }

        @media print { .nav, .btn, .btn-del, .header, .dropdown, input[type="file"] { display: none !important; } }
    </style>
</head>
<body onload="init()">

<div class="header">
    <h1 id="club-title">Golf Pro Manager</h1>
</div>

<div class="nav">
    <button onclick="showTab('tab-dash')" id="nav-dash" class="active">History</button>
    <button onclick="showTab('tab-round')" id="nav-round">Round</button>
    
    <div class="dropdown">
        <button class="dropbtn" id="nav-comps">Comps ▾</button>
        <div class="dropdown-content">
            <button onclick="showTab('tab-doubles')">Doubles</button>
            <button onclick="showTab('tab-pairs')">Pairs (KO)</button>
            <button onclick="showTab('tab-singles')">Singles (KO)</button>
        </div>
    </div>

    <button onclick="showTab('tab-stats')" id="nav-stats">Stats</button>
    <button onclick="showTab('tab-setup')" id="nav-setup">Setup</button>
</div>

<div class="container">
    <!-- TAB: HISTORY -->
    <div id="tab-dash" class="tab-content">
        <div class="card">
            <h3>Major Winners</h3>
            <div id="winners-log" style="color: var(--success); font-weight: bold;"></div>
        </div>
        <div class="card">
            <h3>Recent Rounds</h3>
            <div id="round-log"></div>
        </div>
    </div>

    <!-- TAB: INDIVIDUAL ROUND -->
    <div id="tab-round" class="tab-content hidden">
        <div class="card">
            <h3>Record Round</h3>
            <label>Date</label>
            <input type="date" id="score-date">
            <label>Course</label>
            <select id="score-course"></select>
            <label>Player</label>
            <select id="score-player"></select>
            <label>Hole Scores</label>
            <div class="score-grid" id="grid-individual"></div>
            <button class="btn" style="margin-top:20px" onclick="saveIndividualRound()">Post Scorecard</button>
        </div>
    </div>

    <!-- TAB: DOUBLES -->
    <div id="tab-doubles" class="tab-content hidden">
        <div class="card">
            <h3>Doubles Combined Scoring</h3>
            <p style="font-size:13px; color:#666">Select players to form teams and calculate combined stableford/medal scores.</p>
            <div id="db-player-list" style="max-height: 200px; overflow-y: auto; border:1px solid #eee; padding:10px; border-radius:8px;"></div>
            <button class="btn" style="margin-top:15px" onclick="startDoubles()">Generate Doubles Match</button>
        </div>
    </div>

    <!-- TAB: PAIRS KO -->
    <div id="tab-pairs" class="tab-content hidden">
        <div class="card">
            <h3>Pairs Knockout Bracket</h3>
            <div id="pairs-entry">
                <div id="pairs-sel-list" style="max-height: 200px; overflow-y: auto; border:1px solid #eee; padding:10px; border-radius:8px; margin-bottom:15px;"></div>
                <button class="btn" onclick="generateBracket('pairs')">Create Bracket</button>
            </div>
            <div id="pairs-bracket-display"></div>
        </div>
    </div>

    <!-- TAB: SINGLES KO -->
    <div id="tab-singles" class="tab-content hidden">
        <div class="card">
            <h3>Singles Knockout Bracket</h3>
            <div id="singles-entry">
                <div id="singles-sel-list" style="max-height: 200px; overflow-y: auto; border:1px solid #eee; padding:10px; border-radius:8px; margin-bottom:15px;"></div>
                <button class="btn" onclick="generateBracket('singles')">Create Bracket</button>
            </div>
            <div id="singles-bracket-display"></div>
        </div>
    </div>

    <!-- TAB: STATS -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="card">
            <h3>Player Rankings</h3>
            <table>
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Rounds</th>
                        <th>Avg Score</th>
                        <th>Best</th>
                    </tr>
                </thead>
                <tbody id="stats-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- TAB: SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Name</h3>
            <input type="text" id="club-name-input" placeholder="Enter Club Name">
            <button class="btn" onclick="updateClubName()">Update</button>
        </div>

        <div class="card">
            <h3>Registry</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
                <input type="text" id="new-player-name" placeholder="Player Name">
                <input type="number" id="new-player-hc" placeholder="HC">
            </div>
            <button class="btn" onclick="addPlayer()">Add Player</button>
            <div id="reg-players" style="margin-top:15px"></div>
            <hr>
            <input type="text" id="new-course-name" placeholder="Course Name">
            <button class="btn" onclick="addCourse()">Add Course</button>
            <div id="reg-courses" style="margin-top:15px"></div>
        </div>

        <div class="card">
            <h3>System Backup</h3>
            <button class="btn-outline" style="width:100%; margin-bottom:10px;" onclick="exportData()">Download Backup (.json)</button>
            <input type="file" id="import-file" accept=".json" style="border:none">
            <button class="btn-outline" style="width:100%" onclick="importData()">Restore From File</button>
        </div>
        
        <button class="btn-del" style="width:100%; padding:15px" onclick="fullReset()">FACTORY RESET</button>
    </div>
</div>

<script>
    // --- GLOBAL STATE ---
    let players = [], courses = [], rounds = [], club = {name: "Golf Pro Manager"}, winners = [], brackets = {pairs: [], singles: []};

    function init() {
        load();
        renderHoles('grid-individual');
        renderClubUI();
        showTab('tab-dash');
    }

    // --- STORAGE ---
    function save() {
        localStorage.setItem('gpm_players', JSON.stringify(players));
        localStorage.setItem('gpm_courses', JSON.stringify(courses));
        localStorage.setItem('gpm_rounds', JSON.stringify(rounds));
        localStorage.setItem('gpm_club', JSON.stringify(club));
        localStorage.setItem('gpm_winners', JSON.stringify(winners));
        localStorage.setItem('gpm_brackets', JSON.stringify(brackets));
    }

    function load() {
        players = JSON.parse(localStorage.getItem('gpm_players')) || [];
        courses = JSON.parse(localStorage.getItem('gpm_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('gpm_rounds')) || [];
        club = JSON.parse(localStorage.getItem('gpm_club')) || {name: "Golf Pro Manager"};
        winners = JSON.parse(localStorage.getItem('gpm_winners')) || [];
        brackets = JSON.parse(localStorage.getItem('gpm_brackets')) || {pairs: [], singles: []};
    }

    // --- FILE I/O ---
    function exportData() {
        const out = { players, courses, rounds, club, winners, brackets };
        const blob = new Blob([JSON.stringify(out)], {type: "application/json"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `golf_backup_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
    }

    function importData() {
        const file = document.getElementById('import-file').files[0];
        if(!file) return alert("Select a file");
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            players = data.players; courses = data.courses; rounds = data.rounds; 
            club = data.club; winners = data.winners; brackets = data.brackets;
            save(); location.reload();
        };
        reader.readAsText(file);
    }

    // --- NAVIGATION ---
    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.nav button, .dropbtn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.remove('hidden');
        
        // Handle dropdown highlighting
        if(['tab-doubles', 'tab-pairs', 'tab-singles'].includes(tabId)) {
            document.getElementById('nav-comps').classList.add('active');
        } else {
            const btnId = 'nav-' + tabId.split('-')[1];
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
        }

        // Tab Specific Renders
        if(tabId === 'tab-setup') renderRegistry();
        if(tabId === 'tab-dash') renderDashboard();
        if(tabId === 'tab-round') populateSelects();
        if(tabId === 'tab-stats') renderStats();
        if(tabId === 'tab-doubles') renderTournamentSelectors('db-player-list');
        if(tabId === 'tab-pairs') { renderTournamentSelectors('pairs-sel-list'); renderBracketDisplay('pairs'); }
        if(tabId === 'tab-singles') { renderTournamentSelectors('singles-sel-list'); renderBracketDisplay('singles'); }
    }

    // --- CORE RENDERING ---
    function renderHoles(targetId) {
        const container = document.getElementById(targetId);
        container.innerHTML = '';
        for(let i=1; i<=18; i++) {
            container.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="h-score" data-hole="${i}"></div>`;
        }
    }

    function populateSelects() {
        document.getElementById('score-course').innerHTML = courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('score-player').innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function saveIndividualRound() {
        const pId = document.getElementById('score-player').value;
        const cId = document.getElementById('score-course').value;
        const date = document.getElementById('score-date').value;
        if(!pId || !cId || !date) return alert("Fill all fields");

        let total = 0;
        document.querySelectorAll('.h-score').forEach(input => total += (parseInt(input.value) || 0));
        
        rounds.push({
            id: Date.now(),
            pName: players.find(p => p.id == pId).name,
            cName: courses.find(c => c.id == cId).name,
            score: total,
            date: date
        });
        save();
        alert("Saved to History");
        showTab('tab-dash');
    }

    // --- TOURNAMENTS ---
    function renderTournamentSelectors(containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = players.map(p => `
            <div class="item-row">
                <span>${p.name}</span>
                <input type="checkbox" value="${p.name}" class="tourney-check" style="width:20px">
            </div>
        `).join('');
    }

    function generateBracket(type) {
        const selected = Array.from(document.querySelectorAll(`#${type}-sel-list .tourney-check:checked`)).map(c => c.value);
        if(selected.length < 2) return alert("Select at least 2 players");
        
        brackets[type] = [];
        for(let i = 0; i < selected.length; i += 2) {
            brackets[type].push({
                p1: selected[i],
                p2: selected[i+1] || "BYE",
                winner: null
            });
        }
        save();
        renderBracketDisplay(type);
    }

    function renderBracketDisplay(type) {
        const container = document.getElementById(type + '-bracket-display');
        if(!brackets[type].length) { container.innerHTML = ""; return; }
        
        container.innerHTML = "<h4>Active Matches</h4>" + brackets[type].map((m, idx) => `
            <div class="card" style="border-left: 5px solid var(--accent)">
                <p><strong>Match ${idx+1}:</strong> ${m.p1} vs ${m.p2}</p>
                <button class="btn-outline" onclick="setWinner('${type}', ${idx}, '${m.p1}')">Winner: ${m.p1}</button>
                <button class="btn-outline" onclick="setWinner('${type}', ${idx}, '${m.p2}')">Winner: ${m.p2}</button>
            </div>
        `).join('');
    }

    function setWinner(type, matchIdx, winnerName) {
        if(winnerName === "BYE") return;
        winners.push({
            player: winnerName,
            event: type.toUpperCase() + " Tournament",
            date: new Date().toLocaleDateString()
        });
        brackets[type].splice(matchIdx, 1);
        save();
        showTab('tab-dash');
    }

    // --- REGISTRY & DASH ---
    function renderRegistry() {
        document.getElementById('reg-players').innerHTML = players.map(p => `<div class="item-row"><span>${p.name} (HC: ${p.hc})</span> <button class="btn-del" onclick="removePlayer(${p.id})">Remove</button></div>`).join('');
        document.getElementById('reg-courses').innerHTML = courses.map(c => `<div class="item-row"><span>${c.name}</span> <button class="btn-del" onclick="removeCourse(${c.id})">Remove</button></div>`).join('');
    }

    function renderDashboard() {
        document.getElementById('winners-log').innerHTML = winners.map(w => `<div>🏆 ${w.player} - ${w.event} (${w.date})</div>`).join('');
        document.getElementById('round-log').innerHTML = rounds.slice().reverse().map(r => `
            <div class="item-row">
                <div><strong>${r.pName}</strong><br><small>${r.date} @ ${r.cName}</small></div>
                <div class="badge">${r.score} Pts</div>
            </div>
        `).join('');
    }

    function renderStats() {
        const statsBody = document.getElementById('stats-table-body');
        statsBody.innerHTML = players.map(p => {
            const pRounds = rounds.filter(r => r.pName === p.name);
            const total = pRounds.reduce((acc, curr) => acc + curr.score, 0);
            const avg = pRounds.length ? (total / pRounds.length).toFixed(1) : 0;
            const best = pRounds.length ? Math.max(...pRounds.map(r => r.score)) : 0;
            return `<tr><td>${p.name}</td><td>${pRounds.length}</td><td>${avg}</td><td>${best}</td></tr>`;
        }).join('');
    }

    function addPlayer() {
        const name = document.getElementById('new-player-name').value;
        const hc = document.getElementById('new-player-hc').value;
        if(name) { players.push({id: Date.now(), name, hc}); save(); renderRegistry(); }
    }

    function addCourse() {
        const name = document.getElementById('new-course-name').value;
        if(name) { courses.push({id: Date.now(), name}); save(); renderRegistry(); }
    }

    function removePlayer(id) { players = players.filter(p => p.id !== id); save(); renderRegistry(); }
    function removeCourse(id) { courses = courses.filter(c => c.id !== id); save(); renderRegistry(); }
    function updateClubName() { club.name = document.getElementById('club-name-input').value; save(); renderClubUI(); }
    function renderClubUI() { document.getElementById('club-title').innerText = club.name; }
    function fullReset() { if(confirm("Wipe all data forever?")) { localStorage.clear(); location.reload(); } }

</script>
</body>
</html>
