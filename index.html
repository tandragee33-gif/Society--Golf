<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Tournament Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; --success: #2e7d32; --whatsapp: #25D366; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        #club-logo-display { width: 45px; height: 45px; object-fit: contain; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.1rem; flex-grow: 1; }

        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav button { flex: 1; min-width: 80px; padding: 12px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        
        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .hidden { display: none !important; }
        
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 5px 10px; border-radius: 6px; font-size: 11px; }
        .btn-whatsapp { background: var(--whatsapp); color: white; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        .item-row { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .scroll-area { max-height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; margin: 10px 0; background: #fafafa; }
        
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 9px; }
        .hole-input input { padding: 4px 0; text-align: center; margin: 2px 0; font-size: 12px; }

        .match-card { border: 1px solid #ddd; padding: 12px; margin: 10px 0; border-radius: 8px; border-left: 5px solid var(--accent); }
        .winner-row { background: #e8f5e9; font-weight: bold; color: #2e7d32; }
        
        .team-box { background: #f1f8e9; border: 1px solid #c5e1a5; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .pts-input { width: 60px !important; text-align: center; border: 2px solid var(--primary) !important; margin: 0 !important; }

        @media print { .nav, .btn, .btn-outline, .btn-del, .btn-whatsapp, input, select { display: none !important; } }
    </style>
</head>
<body>

<div class="header">
    <img id="club-logo-display" src="" alt="Logo">
    <h1 id="club-name-text">Golf Pro Manager</h1>
</div>

<div class="nav">
    <button onclick="showTab('dash')" id="nav-dash" class="active">History</button>
    <button onclick="showTab('round')" id="nav-round">Round</button>
    <button onclick="showTab('doubles')" id="nav-doubles">Doubles</button>
    <button onclick="showTab('stats')" id="nav-stats">Stats</button>
    <button onclick="showTab('ko-p')" id="nav-ko-p">Pairs KO</button>
    <button onclick="showTab('ko-s')" id="nav-ko-s">Singles KO</button>
    <button onclick="showTab('setup')" id="nav-setup">Setup</button>
</div>

<div class="container">
    <!-- HISTORY -->
    <div id="tab-dash" class="tab-content">
        <div class="card">
            <h3>Recent Tournaments</h3>
            <div id="past-list"></div>
        </div>
        <div class="card">
            <h3>Round History</h3>
            <select id="season-sel" onchange="renderDashboard()"></select>
            <div id="dash-list"></div>
        </div>
        <div id="dash-detail" class="hidden card">
            <button class="btn-outline" onclick="closeDetail()">← Back</button>
            <h3 id="detail-title"></h3>
            <div id="detail-results"></div>
            <button class="btn-whatsapp" onclick="shareResults()">Share to WhatsApp</button>
        </div>
    </div>

    <!-- SINGLE ROUND ENTRY -->
    <div id="tab-round" class="tab-content hidden">
        <div class="card">
            <h3>Enter Round Score</h3>
            <input type="text" id="rDate" placeholder="Date (dd/mm/yyyy)">
            <select id="rCourse"></select>
            <select id="rPlayer"></select>
            <div class="score-grid" id="round-grid"></div>
            <button class="btn" onclick="saveRound()">Save & Calculate</button>
        </div>
    </div>

    <!-- DOUBLES -->
    <div id="tab-doubles" class="tab-content hidden">
        <div class="card">
            <h3>Doubles Random Pairings</h3>
            <div id="db-step1">
                <p>Select players for today's match:</p>
                <div id="db-selector" class="scroll-area"></div>
                <button class="btn" onclick="generateRandomPairs()">Create Random Pairs</button>
            </div>
            <div id="db-step2" class="hidden">
                <input type="text" id="dbDate" placeholder="Match Date (dd/mm/yyyy)">
                <div id="db-cards"></div>
                <button class="btn" onclick="calcDoubles()">Calculate Winners</button>
                <button class="btn-outline" style="width:100%" onclick="showDbStep1()">Restart Selection</button>
            </div>
            <div id="db-result"></div>
        </div>
    </div>

    <!-- STATS -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="card">
            <h3>All-Time Stats</h3>
            <div id="stats-list" class="scroll-area" style="max-height: 500px;"></div>
        </div>
    </div>

    <!-- KO PAIRS -->
    <div id="tab-ko-p" class="tab-content hidden">
        <div class="card">
            <h3>Pairs Knockout</h3>
            <div id="kop-setup">
                <div id="kop-selector" class="scroll-area"></div>
                <button class="btn" onclick="startKO('pairs')">Generate Bracket</button>
            </div>
            <div id="kop-bracket"></div>
        </div>
    </div>

    <!-- KO SINGLES -->
    <div id="tab-ko-s" class="tab-content hidden">
        <div class="card">
            <h3>Singles Knockout</h3>
            <div id="kos-setup">
                <div id="kos-selector" class="scroll-area"></div>
                <button class="btn" onclick="startKO('singles')">Generate Bracket</button>
            </div>
            <div id="kos-bracket"></div>
        </div>
    </div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Settings</h3>
            <input type="text" id="clubNameInput" placeholder="Club Name">
            <input type="file" accept="image/*" onchange="handleLogo(this)">
            <button class="btn" onclick="updateClub()">Update Club Info</button>
        </div>
        <div class="card">
            <h3 id="pEditTitle">Add Player</h3>
            <input type="hidden" id="editPId">
            <input type="text" id="pName" placeholder="Name">
            <input type="number" id="pHC" placeholder="Handicap">
            <button class="btn" onclick="savePlayer()">Save Player</button>
            <div id="p-list-admin" class="scroll-area"></div>
        </div>
        <div class="card">
            <h3 id="cEditTitle">Add Course</h3>
            <input type="hidden" id="editCId">
            <input type="text" id="cName" placeholder="Course Name">
            <p style="font-size:10px;">Pars / SI:</p>
            <div class="score-grid" id="setup-pars"></div>
            <div class="score-grid" id="setup-si"></div>
            <button class="btn" onclick="saveCourse()">Save Course</button>
            <div id="c-list-admin" class="scroll-area"></div>
        </div>
        <button class="btn-del" style="width:100%" onclick="fullReset()">Wipe All Data</button>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], past = [], club = {name:'Golf Pro Manager', logo:''}, koP = null, koS = null;
    let activeDetail = null;

    function save() {
        localStorage.setItem('g2_players', JSON.stringify(players));
        localStorage.setItem('g2_courses', JSON.stringify(courses));
        localStorage.setItem('g2_rounds', JSON.stringify(rounds));
        localStorage.setItem('g2_past', JSON.stringify(past));
        localStorage.setItem('g2_club', JSON.stringify(club));
        localStorage.setItem('g2_koP', JSON.stringify(koP));
        localStorage.setItem('g2_koS', JSON.stringify(koS));
    }

    function load() {
        players = JSON.parse(localStorage.getItem('g2_players')) || [];
        courses = JSON.parse(localStorage.getItem('g2_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g2_rounds')) || [];
        past = JSON.parse(localStorage.getItem('g2_past')) || [];
        club = JSON.parse(localStorage.getItem('g2_club')) || {name:'Golf Pro Manager', logo:''};
        koP = JSON.parse(localStorage.getItem('g2_koP'));
        koS = JSON.parse(localStorage.getItem('g2_koS'));
    }

    function init() {
        load();
        ['round-grid', 'setup-pars', 'setup-si'].forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = '';
            for(let i=1; i<=18; i++) el.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="${id}-val"></div>`;
        });
        updateClubUI();
        showTab('dash');
    }

    function showTab(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.remove('hidden');
        document.getElementById('nav-' + t).classList.add('active');

        if(t === 'setup') renderAdmin();
        if(t === 'dash') { renderDashboard(); renderPast(); updateSeasonDrops(); }
        if(t === 'round') populateRoundUI();
        if(t === 'doubles') renderDbSelector();
        if(t === 'stats') renderStats();
        if(t === 'ko-p') renderKO('pairs');
        if(t === 'ko-s') renderKO('singles');
    }

    // --- SETUP LOGIC ---
    function savePlayer() {
        const id = document.getElementById('editPId').value;
        const name = document.getElementById('pName').value;
        const hc = document.getElementById('pHC').value;
        if(!name) return;
        if(id) {
            const idx = players.findIndex(p => p.id === id);
            players[idx] = {id, name, handicap: hc};
        } else {
            players.push({id: 'p'+Date.now(), name, handicap: hc});
        }
        save(); clearPForm(); renderAdmin();
    }

    function editP(id) {
        const p = players.find(x => x.id === id);
        document.getElementById('editPId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pHC').value = p.handicap;
        document.getElementById('pEditTitle').innerText = "Edit Player";
    }

    function clearPForm() {
        document.getElementById('editPId').value = '';
        document.getElementById('pName').value = '';
        document.getElementById('pHC').value = '';
        document.getElementById('pEditTitle').innerText = "Add Player";
    }

    function saveCourse() {
        const id = document.getElementById('editCId').value;
        const name = document.getElementById('cName').value;
        const pars = Array.from(document.querySelectorAll('.setup-pars-val')).map(i => i.value || 4);
        const si = Array.from(document.querySelectorAll('.setup-si-val')).map(i => i.value || 1);
        if(!name) return;
        if(id) {
            const idx = courses.findIndex(c => c.id === id);
            courses[idx] = {id, name, pars, si};
        } else {
            courses.push({id: 'c'+Date.now(), name, pars, si});
        }
        save(); clearCForm(); renderAdmin();
    }

    function editC(id) {
        const c = courses.find(x => x.id === id);
        document.getElementById('editCId').value = c.id;
        document.getElementById('cName').value = c.name;
        document.querySelectorAll('.setup-pars-val').forEach((el, i) => el.value = c.pars[i]);
        document.querySelectorAll('.setup-si-val').forEach((el, i) => el.value = c.si[i]);
        document.getElementById('cEditTitle').innerText = "Edit Course";
    }

    function clearCForm() {
        document.getElementById('editCId').value = '';
        document.getElementById('cName').value = '';
        document.querySelectorAll('.setup-pars-val, .setup-si-val').forEach(el => el.value = '');
        document.getElementById('cEditTitle').innerText = "Add Course";
    }

    function renderAdmin() {
        document.getElementById('p-list-admin').innerHTML = players.map(p => `<div class="item-row"><span>${p.name} (${p.handicap})</span><div><button class="btn-outline" onclick="editP('${p.id}')">Edit</button><button class="btn-del" onclick="delP('${p.id}')">X</button></div></div>`).join('');
        document.getElementById('c-list-admin').innerHTML = courses.map(c => `<div class="item-row"><span>${c.name}</span><div><button class="btn-outline" onclick="editC('${c.id}')">Edit</button><button class="btn-del" onclick="delC('${c.id}')">X</button></div></div>`).join('');
    }

    // --- ROUND ENTRY ---
    function populateRoundUI() {
        const d = new Date();
        document.getElementById('rDate').value = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        document.getElementById('rCourse').innerHTML = courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('rPlayer').innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function saveRound() {
        const c = courses.find(x => x.id === document.getElementById('rCourse').value);
        const p = players.find(x => x.id === document.getElementById('rPlayer').value);
        const dt = document.getElementById('rDate').value;
        const strokes = Array.from(document.querySelectorAll('.round-grid-val')).map(i => parseInt(i.value) || 0);
        let pts = 0;
        strokes.forEach((s, i) => {
            if(s > 0) {
                const allow = Math.floor(p.handicap/18) + (p.handicap%18 >= c.si[i] ? 1 : 0);
                pts += Math.max(0, parseInt(c.pars[i]) - (s - allow) + 2);
            }
        });
        rounds.push({id: Date.now(), date: dt, cId: c.id, cName: c.name, pId: p.id, pName: p.name, pts, season: dt.split('/')[2]});
        save(); alert("Saved!"); showTab('dash');
    }

    // --- DOUBLES LOGIC ---
    function renderDbSelector() {
        document.getElementById('db-selector').innerHTML = players.map(p => `<div class="item-row"><span>${p.name}</span><input type="checkbox" class="db-ck" value="${p.id}" style="width:20px;"></div>`).join('');
    }

    function generateRandomPairs() {
        const selectedIds = Array.from(document.querySelectorAll('.db-ck:checked')).map(i => i.value);
        if(selectedIds.length < 2 || selectedIds.length % 2 !== 0) return alert("Select an even number of players.");
        const shuffled = selectedIds.sort(() => 0.5 - Math.random());
        let html = '';
        for(let i=0; i<shuffled.length; i+=2) {
            const p1 = players.find(x => x.id === shuffled[i]);
            const p2 = players.find(x => x.id === shuffled[i+1]);
            html += `<div class="team-box">
                <strong>Pair: ${p1.name} & ${p2.name}</strong>
                <div class="item-row"><span>${p1.name} Pts:</span><input type="number" class="pts-input db-p" data-name="${p1.name}"></div>
                <div class="item-row"><span>${p2.name} Pts:</span><input type="number" class="pts-input db-p" data-name="${p2.name}"></div>
            </div>`;
        }
        document.getElementById('db-cards').innerHTML = html;
        document.getElementById('db-step1').classList.add('hidden');
        document.getElementById('db-step2').classList.remove('hidden');
        const d = new Date();
        document.getElementById('dbDate').value = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function calcDoubles() {
        const cards = document.querySelectorAll('.team-box');
        let results = [];
        cards.forEach(card => {
            const names = card.querySelector('strong').innerText;
            const pts = Array.from(card.querySelectorAll('.db-p')).reduce((sum, i) => sum + (parseInt(i.value) || 0), 0);
            results.push({names, pts});
        });
        results.sort((a,b) => b.pts - a.pts);
        let winMsg = `🏆 Winners: ${results[0].names} (${results[0].pts} pts)`;
        document.getElementById('db-result').innerHTML = `<h3>Results</h3>` + results.map(r => `<div class="item-row"><span>${r.names}</span><b>${r.pts}</b></div>`).join('') + `<div class="champion-box"><h2>${winMsg}</h2><button class="btn-whatsapp" onclick="shareDb('${winMsg}')">WhatsApp Winners</button><button class="btn" onclick="savePast('Doubles','${results[0].names}')">Save to Hall of Fame</button></div>`;
    }

    function showDbStep1() {
        document.getElementById('db-step1').classList.remove('hidden');
        document.getElementById('db-step2').classList.add('hidden');
        document.getElementById('db-result').innerHTML = '';
    }

    // --- KO BRACKETS ---
    function renderKO(type) {
        const t = type === 'pairs' ? koP : koS;
        const setup = document.getElementById(type === 'pairs' ? 'kop-setup' : 'kos-setup');
        const bracket = document.getElementById(type === 'pairs' ? 'kop-bracket' : 'kos-bracket');
        if(!t) {
            setup.classList.remove('hidden'); bracket.classList.add('hidden');
            const sel = document.getElementById(type === 'pairs' ? 'kop-selector' : 'kos-selector');
            sel.innerHTML = players.map(p => `<div class="item-row"><span>${p.name}</span><input type="checkbox" class="${type}-ck" value="${p.id}" style="width:20px;"></div>`).join('');
        } else {
            setup.classList.add('hidden'); bracket.classList.remove('hidden');
            bracket.innerHTML = `<button class="btn-del" onclick="resetKO('${type}')">Reset Bracket</button>` + t.rounds.map((r, i) => `<h4>Round ${i+1}</h4>` + r.map(m => `
                <div class="match-card">
                    <div class="${m.w==='A'?'winner-row':''}">${m.pA.n}</div>
                    <div class="${m.w==='B'?'winner-row':''}">${m.pB ? m.pB.n : 'BYE'}</div>
                    <div style="margin-top:5px;"><button class="btn-outline" onclick="setWin('${type}',${i},'${m.id}','A')">Win A</button><button class="btn-outline" onclick="setWin('${type}',${i},'${m.id}','B')">Win B</button></div>
                </div>`).join('')).join('');
            
            const last = t.rounds[t.rounds.length-1];
            if(last.length === 1 && last[0].w) {
                const champ = last[0].w === 'A' ? last[0].pA.n : last[0].pB.n;
                bracket.innerHTML += `<div class="champion-box"><h2>🏆 ${champ} is Champion!</h2><button class="btn" onclick="savePast('${type} KO','${champ}')">Save to History</button></div>`;
            }
        }
    }

    function startKO(type) {
        const ids = Array.from(document.querySelectorAll(`.${type}-ck:checked`)).map(i => i.value);
        if(ids.length < 2) return;
        let units = [];
        if(type === 'singles') {
            units = ids.map(id => ({id, n: players.find(x=>x.id===id).name}));
        } else {
            const shuf = ids.sort(()=>0.5-Math.random());
            for(let i=0; i<shuf.length; i+=2) {
                if(shuf[i+1]) units.push({id:'u'+i, n: players.find(x=>x.id===shuf[i]).name + '/' + players.find(x=>x.id===shuf[i+1]).name});
                else units.push({id:'u'+i, n: players.find(x=>x.id===shuf[i]).name});
            }
        }
        let matches = [];
        for(let i=0; i<units.length; i+=2) matches.push({id:'m'+i, pA: units[i], pB: units[i+1]||null, w: units[i+1]?null:'A'});
        const obj = {rounds: [matches]};
        if(type==='pairs') koP = obj; else koS = obj;
        save(); progressKO(type); renderKO(type);
    }

    function setWin(type, rIdx, mId, w) {
        const t = type === 'pairs' ? koP : koS;
        const m = t.rounds[rIdx].find(x => x.id === mId);
        if(m.pB) m.w = w;
        save(); progressKO(type); renderKO(type);
    }

    function progressKO(type) {
        const t = type === 'pairs' ? koP : koS;
        let last = t.rounds[t.rounds.length-1];
        if(last.every(m => m.w !== null) && last.length > 1) {
            const winners = last.map(m => m.w === 'A' ? m.pA : m.pB);
            let next = [];
            for(let i=0; i<winners.length; i+=2) next.push({id:'m'+Date.now()+i, pA: winners[i], pB: winners[i+1]||null, w: winners[i+1]?null:'A'});
            t.rounds.push(next);
            save(); progressKO(type);
        }
    }

    // --- DASHBOARD & UTILS ---
    function renderDashboard() {
        const s = document.getElementById('season-sel').value;
        const filtered = rounds.filter(r => r.season === s);
        const grouped = filtered.reduce((acc, r) => {
            const k = r.date + r.cId;
            if(!acc[k]) acc[k] = {date: r.date, c: r.cName, cid: r.cId, count: 0};
            acc[k].count++; return acc;
        }, {});
        document.getElementById('dash-list').innerHTML = Object.values(grouped).map(g => `<div class="item-row" onclick="viewDetail('${g.date}','${g.cid}')"><span>${g.c}<br><small>${g.date}</small></span><span>${g.count} Players ></span></div>`).join('');
    }

    function viewDetail(dt, cid) {
        activeDetail = rounds.filter(r => r.date === dt && r.cId === cid).sort((a,b)=>b.pts-a.pts);
        document.getElementById('dash-detail').classList.remove('hidden');
        document.getElementById('detail-title').innerText = activeDetail[0].cName + " ("+dt+")";
        document.getElementById('detail-results').innerHTML = activeDetail.map((r, i) => `<div class="item-row ${i===0?'winner-row':''}"><span>${i+1}. ${r.pName}</span><b>${r.pts} pts</b></div>`).join('');
    }

    function renderStats() {
        document.getElementById('stats-list').innerHTML = rounds.sort((a,b)=>b.id-a.id).map(r => `<div class="item-row"><span>${r.pName}<br><small>${r.cName} (${r.date})</small></span><b>${r.pts} pts</b><button class="btn-del" onclick="delR(${r.id})">X</button></div>`).join('');
    }

    function shareResults() {
        if(!activeDetail) return;
        let msg = `⛳ *${activeDetail[0].cName} Leaderboard*\n`;
        activeDetail.forEach((r, i) => msg += `${i+1}. ${r.pName}: ${r.pts} pts\n`);
        window.location.href = "whatsapp://send?text=" + encodeURIComponent(msg);
    }

    function shareDb(txt) { window.location.href = "whatsapp://send?text=" + encodeURIComponent(txt); }
    function savePast(type, win) { past.push({type, win, date: new Date().toLocaleDateString()}); save(); showTab('dash'); }
    function renderPast() { document.getElementById('past-list').innerHTML = past.map(p => `<div class="item-row"><span>🏆 ${p.win}<br><small>${p.type} (${p.date})</small></span></div>`).join(''); }
    function updateSeasonDrops() {
        const s = [...new Set(rounds.map(r => r.season))];
        document.getElementById('season-sel').innerHTML = s.map(x => `<option value="${x}">${x} Season</option>`).join('');
    }
    function updateClubUI() { document.getElementById('club-name-text').innerText = club.name; if(club.logo) { document.getElementById('club-logo-display').src = club.logo; document.getElementById('club-logo-display').style.display = 'block'; } }
    function updateClub() { club.name = document.getElementById('clubNameInput').value; save(); updateClubUI(); }
    function handleLogo(i) { if(i.files[0]) { const r = new FileReader(); r.onload=e=>{club.logo=e.target.result; save(); updateClubUI();}; r.readAsDataURL(i.files[0]); } }
    function delP(id) { players = players.filter(p=>p.id!==id); save(); renderAdmin(); }
    function delC(id) { courses = courses.filter(c=>c.id!==id); save(); renderAdmin(); }
    function delR(id) { rounds = rounds.filter(r=>r.id!==id); save(); renderStats(); }
    function closeDetail() { document.getElementById('dash-detail').classList.add('hidden'); }
    function resetKO(type) { if(type==='pairs') koP=null; else koS=null; save(); renderKO(type); }
    function fullReset() { if(confirm("ERASE ALL?")) { localStorage.clear(); location.reload(); } }

    init();
</script>
</body>
</html>
