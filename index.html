<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pro Manager - Tournament Edition</title>
    <style>
        :root { --primary: #1b5e20; --accent: #ffd700; --danger: #d32f2f; --light: #f4f4f4; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #e0e0e0; color: #333; }
        
        .header { background: white; padding: 15px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; gap: 15px; }
        #club-logo-display { width: 50px; height: 50px; object-fit: contain; border-radius: 5px; display: none; }
        .header h1 { margin: 0; color: var(--primary); font-size: 1.2rem; flex-grow: 1; }

        .nav { display: flex; background: var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav button { flex: 1; min-width: 85px; padding: 14px 5px; border: none; background: none; color: white; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .nav button.active { border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }
        
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-del { background: var(--danger); color: white; border: none; width: auto; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        
        .item-row { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; }
        .score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 10px 0; }
        .hole-input { text-align: center; font-size: 10px; }
        .hole-input input { padding: 4px 0; text-align: center; width: 100% !important; }

        .selector-list { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 8px; }
        .selector-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .selector-item input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; }

        .match-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; background: #fff; border-left: 5px solid var(--accent); }
        .winner-row { background: #e8f5e9; font-weight: bold; color: #2e7d32; padding: 4px; border-radius: 4px; }

        .pts-input { width: 60px !important; text-align: center; margin: 0 !important; padding: 5px !important; border: 2px solid var(--primary); }
        .team-box { background: #f9f9f9; border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; }

        .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .stats-table th { text-align: left; background: #f8f8f8; padding: 8px; border-bottom: 2px solid #ddd; }
        .stats-table td { padding: 8px; border-bottom: 1px solid #eee; }

        .gold-medal { background: #fff9c4 !important; border-left: 5px solid var(--accent) !important; }

        @media print {
            .nav, .btn, .btn-outline, .btn-del, .selector-list, label, #db-step1, input, hr { display: none !important; }
            .card { box-shadow: none; border: 1px solid #ccc; }
            .hidden { display: block !important; }
            .pts-input { border: none !important; }
        }
    </style>
</head>
<body>

<div class="header">
    <img id="club-logo-display" src="" alt="Logo">
    <h1 id="header-club-name">Golf Pro Manager</h1>
</div>

<div class="nav">
    <button onclick="showTab('tab-dash')" id="btn-dash" class="active">History</button>
    <button onclick="showTab('tab-leaderboard')" id="btn-leaderboard">Leaderboard</button>
    <button onclick="showTab('tab-comp')" id="btn-comp">Round</button>
    <button onclick="showTab('tab-doubles')" id="btn-doubles">Doubles</button>
    <button onclick="showTab('tab-stats')" id="btn-stats">Stats</button>
    <button onclick="showTab('tab-pairs')" id="btn-pairs">Pairs (KO)</button>
    <button onclick="showTab('tab-singles')" id="btn-singles">Singles (KO)</button>
    <button onclick="showTab('tab-setup')" id="btn-setup">Setup</button>
</div>

<div class="container">
    <!-- DASHBOARD -->
    <div id="tab-dash" class="tab-content">
        <div class="card">
            <h3>Recent Activity</h3>
            <select id="dashSeason" onchange="renderDashboard()"></select>
            <div id="dash-list"></div>
        </div>
        <div id="dash-detail" class="hidden card">
            <button class="btn-outline" onclick="closeDetail()">← Back</button>
            <h3 id="detail-title"></h3>
            <div id="detail-results"></div>
        </div>
    </div>

    <!-- LEADERBOARD -->
    <div id="tab-leaderboard" class="tab-content hidden">
        <div class="card">
            <h3>Tournament Leaderboards</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn-outline" onclick="renderLeaderboard('all')">All Time</button>
                <button class="btn-outline" onclick="renderLeaderboard('today')">Today's Best</button>
            </div>
            <div id="leaderboard-display"></div>
        </div>
    </div>

    <!-- ROUND ENTRY -->
    <div id="tab-comp" class="tab-content hidden">
        <div class="card">
            <h3 id="roundTitle">New Round</h3>
            <input type="hidden" id="editRoundId">
            <label style="font-size:12px;">Date (dd/mm/yyyy):</label>
            <input type="text" id="rDate" placeholder="dd/mm/yyyy">
            <select id="rCourse"></select>
            <select id="rPlayer"></select>
            <div class="score-grid" id="round-scores"></div>
            <button class="btn" onclick="saveRound()">Save Result</button>
            <button class="btn-outline" style="width:100%" onclick="resetRoundForm()">Clear / New</button>
        </div>
    </div>

    <!-- DOUBLES -->
    <div id="tab-doubles" class="tab-content hidden">
        <div class="card">
            <h3>Doubles Combined Points</h3>
            <label style="font-size:12px;">Match Date:</label>
            <input type="text" id="dbDate" placeholder="dd/mm/yyyy" onchange="updateScorecardFromHistory()">
            <div id="db-step1">
                <div id="doubles-selector" class="selector-list"></div>
                <button class="btn" onclick="setupDoublesTeams()">Create Scorecards</button>
            </div>
            <div id="db-step2" class="hidden">
                <div id="doubles-scorecards"></div>
                <button class="btn" onclick="calculateDoublesResults()">Calculate Results</button>
                <button class="btn-outline" style="width:100%" onclick="showDbStep1()">Back</button>
            </div>
            <hr>
            <div id="doubles-output"></div>
        </div>
    </div>

    <!-- STATS -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="card">
            <h3>All Rounds</h3>
            <table class="stats-table">
                <thead><tr><th>Player</th><th>Date</th><th>Pts</th><th>Actions</th></tr></thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>
    </div>

    <!-- PAIRS KNOCKOUT -->
    <div id="tab-pairs" class="tab-content hidden">
        <div class="card">
            <h3>Pairs Knockdown</h3>
            <div id="p-setup">
                <div id="p-selector" class="selector-list"></div>
                <button class="btn" onclick="initTourney('pairs')">Generate Bracket</button>
            </div>
            <div id="p-bracket"></div>
        </div>
    </div>

    <!-- SINGLES KNOCKOUT -->
    <div id="tab-singles" class="tab-content hidden">
        <div class="card">
            <h3>Singles Knockdown</h3>
            <div id="s-setup">
                <div id="s-selector" class="selector-list"></div>
                <button class="btn" onclick="initTourney('singles')">Generate Bracket</button>
            </div>
            <div id="s-bracket"></div>
        </div>
    </div>

    <!-- SETUP -->
    <div id="tab-setup" class="tab-content hidden">
        <div class="card">
            <h3>Club Profile</h3>
            <input type="text" id="setupClubName" placeholder="Club Name">
            <input type="file" accept="image/*" onchange="processLogo(this)">
            <button class="btn" onclick="saveClubProfile()">Save Profile</button>
        </div>
        <div class="card">
            <h3>Add Player</h3>
            <input type="hidden" id="editPlayerId">
            <input type="text" id="pName" placeholder="Name">
            <input type="number" id="pHC" placeholder="Handicap">
            <button class="btn" onclick="savePlayer()">Save Player</button>
            <div id="admin-players"></div>
        </div>
        <div class="card">
            <h3>Add Course</h3>
            <input type="hidden" id="editCourseId">
            <input type="text" id="cName" placeholder="Course Name">
            <div class="score-grid" id="setup-pars"></div>
            <div class="score-grid" id="setup-si"></div>
            <button class="btn" onclick="saveCourse()">Save Course</button>
            <div id="admin-courses"></div>
        </div>
        <button class="btn-del" style="width:100%" onclick="factoryReset()">Master Data Wipe</button>
    </div>
</div>

<script>
    let players = [], courses = [], rounds = [], pairsT = null, singlesT = null, club = { name: "Golf Pro Manager", logo: "" };

    // --- DATA HANDLING ---
    function loadData() {
        players = JSON.parse(localStorage.getItem('g_players')) || [];
        courses = JSON.parse(localStorage.getItem('g_courses')) || [];
        rounds = JSON.parse(localStorage.getItem('g_rounds')) || [];
        pairsT = JSON.parse(localStorage.getItem('g_pairsT'));
        singlesT = JSON.parse(localStorage.getItem('g_singlesT'));
        club = JSON.parse(localStorage.getItem('g_club')) || { name: "Golf Pro Manager", logo: "" };
    }

    function saveData() {
        localStorage.setItem('g_players', JSON.stringify(players));
        localStorage.setItem('g_courses', JSON.stringify(courses));
        localStorage.setItem('g_rounds', JSON.stringify(rounds));
        localStorage.setItem('g_pairsT', JSON.stringify(pairsT));
        localStorage.setItem('g_singlesT', JSON.stringify(singlesT));
        localStorage.setItem('g_club', JSON.stringify(club));
    }

    // --- NAVIGATION ---
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        const btn = document.getElementById('btn-' + id.split('-')[1]);
        if(btn) btn.classList.add('active');

        loadData();
        if(id === 'tab-dash') { updateSeasonDropdown(); renderDashboard(); }
        if(id === 'tab-leaderboard') renderLeaderboard('all');
        if(id === 'tab-stats') renderStats();
        if(id === 'tab-setup') renderAdmin();
        if(id === 'tab-pairs' || id === 'tab-singles') renderMatchplay(id.split('-')[1]);
        if(id === 'tab-doubles') renderDoublesSelector();
        if(id === 'tab-comp') {
            document.getElementById('rCourse').innerHTML = courses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('rPlayer').innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }
    }

    // --- LEADERBOARD ---
    function renderLeaderboard(filter) {
        const display = document.getElementById('leaderboard-display');
        const todayStr = new Date().toISOString().split('T')[0];
        let filtered = [...rounds];
        if (filter === 'today') filtered = filtered.filter(r => r.date === todayStr);
        
        filtered.sort((a, b) => b.points - a.points);

        display.innerHTML = filtered.length === 0 ? `<p>No rounds found.</p>` : 
            filtered.map((r, i) => `
            <div class="item-row ${i === 0 ? 'gold-medal' : ''}">
                <span><strong>#${i+1}</strong> ${r.playerName}<br><small>${r.courseName}</small></span>
                <span style="font-weight:bold">${r.points} pts</span>
            </div>`).join('');
    }

    // --- TOURNAMENT (KNOCKOUT) LOGIC ---
    function renderMatchplay(type) {
        const t = (type === 'pairs') ? pairsT : singlesT;
        const setupDiv = document.getElementById(type + '-setup');
        const bracketDiv = document.getElementById(type + '-bracket');
        
        if(!t) {
            setupDiv.classList.remove('hidden'); bracketDiv.classList.add('hidden');
            document.getElementById(type + '-selector').innerHTML = players.map(p => `
                <div class="selector-item">
                    <label>${p.name}</label>
                    <input type="checkbox" class="${type}-ck" value="${p.id}">
                </div>`).join('');
        } else {
            setupDiv.classList.add('hidden'); bracketDiv.classList.remove('hidden');
            let html = `<button class="btn-del" onclick="resetT('${type}')">Reset Bracket</button>`;
            
            t.rounds.forEach((rd, i) => {
                html += `<h4>Round ${i+1}</h4>`;
                rd.forEach(m => {
                    html += `
                    <div class="match-card">
                        <div class="${m.win==='A'?'winner-row':''}">${m.uA.name}</div>
                        <div style="text-align:center; font-size:10px;">VS</div>
                        <div class="${m.win==='B'?'winner-row':''}">${m.uB ? m.uB.name : 'BYE'}</div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <button class="btn-outline" onclick="setWin('${type}',${i},'${m.id}','A')">Win A</button>
                            ${m.uB ? `<button class="btn-outline" onclick="setWin('${type}',${i},'${m.id}','B')">Win B</button>` : ''}
                        </div>
                    </div>`;
                });

                if (i === t.rounds.length - 1 && rd.every(m => m.win !== null) && rd.length > 1) {
                    html += `<button class="btn" onclick="advanceRound('${type}')">Generate Next Round</button>`;
                }
            });
            bracketDiv.innerHTML = html;
        }
    }

    function initTourney(type) {
        const ids = Array.from(document.querySelectorAll('.'+type+'-ck:checked')).map(i => i.value);
        if(ids.length < 2) return alert("Select at least 2.");
        let units = [];
        if(type === 'pairs') {
            const shuf = ids.sort(() => 0.5 - Math.random());
            for(let i=0; i<shuf.length; i+=2) {
                if(shuf[i+1]) units.push({id: 'u'+i, name: players.find(p=>p.id==shuf[i]).name + " / " + players.find(p=>p.id==shuf[i+1]).name});
                else units.push({id: 'u'+i, name: players.find(p=>p.id==shuf[i]).name});
            }
        } else {
            units = ids.map(id => ({id: 'u'+id, name: players.find(p=>p.id==id).name}));
        }
        
        const matches = [];
        for(let i=0; i<units.length; i+=2) {
            matches.push({id: 'm'+i, uA: units[i], uB: units[i+1] || null, win: units[i+1] ? null : 'A'});
        }
        const obj = { rounds: [matches] };
        if(type==='pairs') pairsT = obj; else singlesT = obj;
        saveData(); renderMatchplay(type);
    }

    function setWin(type, rIdx, mId, win) {
        const t = (type === 'pairs') ? pairsT : singlesT;
        t.rounds[rIdx].find(x => x.id === mId).win = win;
        saveData(); renderMatchplay(type);
    }

    function advanceRound(type) {
        const t = (type === 'pairs') ? pairsT : singlesT;
        const winners = t.rounds[t.rounds.length-1].map(m => m.win === 'A' ? m.uA : m.uB);
        const nextMatches = [];
        for(let i=0; i<winners.length; i+=2) {
            nextMatches.push({id: 'm'+Date.now()+i, uA: winners[i], uB: winners[i+1] || null, win: winners[i+1] ? null : 'A'});
        }
        t.rounds.push(nextMatches);
        saveData(); renderMatchplay(type);
    }

    function resetT(type) { if(confirm("Reset?")) { if(type==='pairs') pairsT=null; else singlesT=null; saveData(); renderMatchplay(type); }}

    // --- SETUP & UTILS ---
    function saveRound() {
        const crs = courses.find(c => String(c.id) === String(document.getElementById('rCourse').value));
        const plr = players.find(p => String(p.id) === String(document.getElementById('rPlayer').value));
        const dateRaw = document.getElementById('rDate').value;
        const isoDate = dateRaw.split('/').reverse().join('-');
        const scs = Array.from(document.querySelectorAll('.round-scores-val')).map(i => parseInt(i.value) || 0);
        
        let pts = 0;
        scs.forEach((s, i) => {
            if(s > 0) {
                const par = parseInt(crs.pars[i]), si = parseInt(crs.si[i]), hc = parseInt(plr.handicap);
                const allow = Math.floor(hc/18) + (hc%18 >= si ? 1 : 0);
                pts += Math.max(0, par - (s - allow) + 2);
            }
        });

        rounds.push({ id: Date.now(), date: isoDate, courseName: crs.name, playerName: plr.name, points: pts, season: isoDate.split('-')[0] });
        saveData(); showTab('tab-leaderboard');
    }

    function renderAdmin() {
        document.getElementById('admin-players').innerHTML = players.map(p => `<div class="item-row">${p.name} (HC: ${p.handicap})</div>`).join('');
        document.getElementById('admin-courses').innerHTML = courses.map(c => `<div class="item-row">${c.name}</div>`).join('');
    }

    function savePlayer() {
        players.push({ id: 'p'+Date.now(), name: document.getElementById('pName').value, handicap: document.getElementById('pHC').value });
        saveData(); renderAdmin();
    }

    function saveCourse() {
        courses.push({ id: 'c'+Date.now(), name: document.getElementById('cName').value, 
            pars: Array.from(document.querySelectorAll('.setup-pars-val')).map(i => i.value),
            si: Array.from(document.querySelectorAll('.setup-si-val')).map(i => i.value) 
        });
        saveData(); renderAdmin();
    }

    function setupInputGrids() {
        ['round-scores', 'setup-pars', 'setup-si'].forEach(g => {
            const el = document.getElementById(g);
            for(let i=1; i<=18; i++) el.innerHTML += `<div class="hole-input"><label>${i}</label><input type="number" class="${g}-val"></div>`;
        });
    }

    function updateSeasonDropdown() {
        const years = [...new Set(rounds.map(r => r.season)), new Date().getFullYear().toString()].sort().reverse();
        document.getElementById('dashSeason').innerHTML = years.map(y => `<option value="${y}">${y} Season</option>`).join('');
    }

    function renderDashboard() {
        const s = document.getElementById('dashSeason').value;
        const filtered = rounds.filter(r => r.season === s);
        document.getElementById('dash-list').innerHTML = filtered.map(r => `<div class="item-row"><span>${r.playerName}<br><small>${r.date}</small></span><span>${r.points} pts</span></div>`).join('');
    }

    function factoryReset() { if(confirm("Erase everything?")) { localStorage.clear(); location.reload(); }}

    window.onload = () => { loadData(); setupInputGrids(); showTab('tab-dash'); };
</script>
</body>
</html>
